[workspace]
authors = ["Nick Smith <nick.smith@cern.ch>"]
channels = ["conda-forge", "pytorch"]
name = "vibegraph"
platforms = ["osx-arm64"]
version = "0.1.0"

# Default environment: no conda deps (Rust toolchain managed by rustup)
[dependencies]

[tasks]
install-samply = "which samply || cargo install --locked samply"
profile-diagrams = { cmd = "bash scripts/profile.sh validate_madgraph_diagrams", depends-on = ["install-samply"] }
# Profile the sigma gate under samply: per-process time is weighted by how hard
# each process is to integrate (unlike a fixed-N eval micro-benchmark)
profile-sigma = { cmd = "bash scripts/profile.sh validate_sigma", depends-on = ["install-samply"] }
# Custom command to build docs with MathJax support for rendering LaTeX in docstrings
docs = "RUSTDOCFLAGS=\"--html-in-header doc-include/mathjax-header.html\" cargo doc --no-deps"
# Ensure the SM UFO submodule is checked out (offline once the object cache exists)
init-sm-submodule = "git submodule update --init research/refs/mg5amcnlo"
# Fail if the committed interned SM blob (src/ufo/sm_assets/, written by the
# gen_sm_blob dev binary) disagrees with a fresh parse of the pinned submodule —
# catches a stale blob after a submodule bump or an SM UFO source edit. A bare
# `cargo test` skips this check when the submodule isn't checked out, so this task
# inits it first.
check-sm-blob-fresh = { cmd = "cargo test -p vibegraph-lib --lib ufo::sm::tests::interned_blob_matches_submodule_exactly -- --exact", depends-on = [
    "init-sm-submodule",
] }


# --- nougat: scientific PDF OCR ---
# Converts scanned academic PDFs to markdown+LaTeX
[feature.nougat.dependencies]
python = ">=3.10,<3.12"
pip = "*"
pytorch = ">=2.0"

[feature.nougat.pypi-dependencies]
nougat-ocr = "*"
albumentations = "<1.4"  # nougat incompatible with albumentations>=1.4 (ImageCompression API change)
pypdfium2 = "<5"         # nougat uses PdfDocument.render() which was removed in pypdfium2 v5
transformers = "<4.36"   # nougat incompatible with transformers>=4.36 (cache_position kwarg added to generate)

[feature.nougat.tasks]
# Example: pixi run -e nougat ocr
ocr = "nougat research/refs/papers/helas.pdf -o research/refs/papers/"

# --- madgraph: MadGraph5_aMC@NLO for cross-section validation ---
# mg5amcnlo 3.5.7 builds against Python 3.11 on osx-arm64 (native Apple Silicon)
# conda-forge package includes fortran-compiler, lhapdf, hepmc2/3, fastjet, etc.
[feature.madgraph.dependencies]
python = "3.11.*"
mg5amcnlo = "==3.5.7"

[feature.madgraph.tasks]
# Build all diagram validation output via MadGraph
# Generates process directories with SubProcesses/P*/ containing Feynman diagrams
build-diagrams = "bash validation/madgraph/build.sh"
# Extract diagram counts and metadata from MadGraph output
extract-diagrams = { cmd = "python validation/madgraph/extract_diagrams.py", depends-on = ["build-diagrams"] }
# Full pipeline: extract MadGraph reference data, then run extended Rust tests
validate-diagrams = { cmd = "cargo test -p vibegraph-lib --profile profiling --features extended-validation --test validate_madgraph_diagrams", depends-on = ["extract-diagrams"] }
# Compile MadGraph Fortran MATRIX1 subroutines via f2py into Python extension modules
build-amplitude = { cmd = "bash validation/madgraph/build_amplitude.sh", depends-on = ["build-diagrams"] }
# Evaluate compiled matrix elements on a fixed kinematic grid and write reference CSVs
generate-amplitude = { cmd = "python validation/madgraph/gen_amplitude.py", depends-on = ["build-amplitude"] }
# Full pipeline: build amplitudes, generate reference CSVs, run Rust comparison tests
validate-helas-mg = { cmd = "cargo test -p vibegraph-lib --profile profiling --features extended-validation --test validate_helas_mg", depends-on = ["generate-amplitude"] }
# CF-matrix gate: the exact colour-factor matrix and NCOLOR against every
# generated matrix1_orig.f's DATA CF block
validate-color-cf = { cmd = "cargo test -p vibegraph-lib --features extended-validation --test color_cf_oracle -- --nocapture", depends-on = ["build-diagrams"] }
# Colour-line gate: each flow's Les Houches ICOLUP connectivity against leshouche.inc
validate-color-flow-tags = { cmd = "cargo test -p vibegraph-lib --features extended-validation --test color_flow_tags_oracle -- --nocapture", depends-on = ["build-diagrams"] }
# Bank MadGraph's per-flow JAMP() values into the committed colour-flow reference
generate-jamp-reference = { cmd = "python validation/madgraph/gen_jamp_reference.py", depends-on = ["generate-amplitude"] }
# Per-flow JAMP / JAMP2 gate: the linear level the CF-contracted |M|² is blind to
# (per-flow phase, per-flow normalisation, colour-basis permutation)
validate-color-jamp = { cmd = "cargo test -p vibegraph-lib --features extended-validation --test color_jamp_oracle -- --nocapture", depends-on = ["build-amplitude"] }
# Bank MadGraph's per-diagram AMP() values (and the colour coefficients that turn
# them into JAMP(1)) into the committed single-flow per-diagram reference
generate-amp-reference = { cmd = "python validation/madgraph/gen_amp_reference.py", depends-on = ["generate-amplitude"] }
# Per-diagram amplitude gate: the linear level the helicity- and diagram-summed
# |M|^2 is blind to (relative per-diagram sign, helicity assignment, colour
# coefficient), for the single-flow processes
validate-amp-diagram = { cmd = "cargo test -p vibegraph-lib --features extended-validation --test amp_diagram_oracle -- --nocapture", depends-on = ["build-amplitude"] }
# Bank the fixed-energy MadGraph cross sections (sigma +- err) into the committed
# sigma reference consumed by the sigma-level integration gate
extract-sigma = { cmd = "python validation/madgraph/extract_sigma.py", depends-on = ["build-diagrams"] }
# Cross-section (sigma) gate: integrate each fixed-energy process through the
# library path with its real run card and compare against the banked MG sigma.
# Runs under --profile profiling; build/samply the same target to weight time by
# integration difficulty (see validate_sigma.rs / README).
validate-sigma = { cmd = "cargo test -p vibegraph-lib --profile profiling --features extended-validation --test validate_sigma -- --nocapture", depends-on = ["extract-sigma"] }
# Unweighting gate: accept/reject over each process's frozen per-channel VEGAS
# grids, with the event sample compared against the weighted estimator over the
# same grids — in sigma (swept over generation seeds) and in binned distributions
validate-unweighting = { cmd = "cargo test -p vibegraph-lib --profile profiling --features extended-validation --test validate_unweighting -- --nocapture", depends-on = ["build-diagrams"] }
# Les Houches output gate: MadGraph's own banked events re-serialised byte-for-byte
# through our record types (the format oracle), the mutation checks that make that
# round-trip evidence, and a generated sample written out and read back
validate-lhef = { cmd = "cargo test -p vibegraph-lib --profile profiling --features extended-validation --test validate_lhef -- --nocapture", depends-on = ["build-diagrams"] }
# Link MadGraph's own alfas_functions.f against a driver and write the committed
# running-alpha_s reference grid (validation/alphas/reference.csv)
generate-alphas-reference = "bash validation/alphas/gen_reference.sh"
# Running-alpha_s gate: the reference grid bit-for-bit, plus the per-event AQCDUP
# field of every banked LHE and the asmz/nloop source rule against the MG run logs
validate-alphas = { cmd = "cargo test -p vibegraph-lib --features extended-validation --test validate_alphas -- --nocapture", depends-on = ["generate-alphas-reference", "build-diagrams"] }
# Per-event scale gate: the renormalisation and factorisation scales replayed against
# SCALUP, <rscale> and <pdfrwt> for every event of every banked LHE
validate-scales = { cmd = "cargo test -p vibegraph-lib --features extended-validation --test validate_scales -- --nocapture", depends-on = ["build-diagrams"] }
# Per-event coupling gate: the constant-pool scaling path against a full model
# re-evaluation, entry by entry at 100 random alpha_s, for all 14 amplitude-gate processes
validate-scale-couplings = { cmd = "cargo test -p vibegraph-lib --profile profiling --features extended-validation --test validate_scale_couplings -- --nocapture", depends-on = ["build-diagrams"] }
# Dump the RunCardLO defaults to JSON — the transcription oracle for the Rust run-card defaults table
dump-runcard-defaults = "python validation/madgraph/dump_runcard_defaults.py"
# Generate the banked MG reference sigma(pp->e+e-) for the two H7 run cards
generate-hadronic-sigma = "bash validation/madgraph/gen_hadronic_sigma.sh"
# Build the MG |M|^2 probe and (re)generate the pointwise DY integrand oracle
generate-dy-oracle = { cmd = "bash validation/madgraph/gen_dy_oracle.sh", depends-on = ["fetch-pdf"] }
# Fetch the pinned NNPDF23_lo_as_0130_qed set from the LHAPDF data server
fetch-pdf = "bash validation/pdf/fetch.sh"
# Fetch a genuinely multi-Q²-subgrid LO set (two bands joined at one seam);
# the DY oracle still needs NNPDF23, so this is additive, not a replacement
fetch-pdf-multigrid = "bash validation/pdf/fetch.sh NNPDF31_lo_as_0130"
# Compile the LHAPDF C++ PDF-grid oracle generator (rpath makes it self-contained;
# system c++/clang++ from /usr/bin is used when the env ships no compiler)
build-pdf-oracle = "c++ -std=c++17 -O2 validation/pdf/gen_oracle.cpp $(lhapdf-config --cflags --ldflags) -lLHAPDF -Wl,-rpath,$(lhapdf-config --libdir) -o validation/pdf/gen_oracle"
# Run the LHAPDF C++ oracle over the fetched set, dumping oracle.json (MG's own
# PDF library, so its log-bicubic interpolation is the reference for matching MG)
generate-pdf-oracle = { cmd = "validation/pdf/gen_oracle validation/pdf NNPDF23_lo_as_0130_qed 0 validation/pdf/oracle.json", depends-on = ["fetch-pdf", "build-pdf-oracle"] }
# Run the same oracle over the multi-subgrid set, dumping oracle_multigrid.json
# (subgrid-walk + seam-interpolation reference)
generate-pdf-oracle-multigrid = { cmd = "validation/pdf/gen_oracle validation/pdf NNPDF31_lo_as_0130 0 validation/pdf/oracle_multigrid.json", depends-on = ["fetch-pdf-multigrid", "build-pdf-oracle"] }
# Full pipeline: fetch both sets, build+run the oracle over each, run the Rust
# comparison test (single- and multi-subgrid paths)
validate-pdf-grid = { cmd = "cargo test -p vibegraph-lib --features extended-validation --test validate_pdf_grid", depends-on = ["generate-pdf-oracle", "generate-pdf-oracle-multigrid"] }

# --- helas-validation: Fortran77 HELAS compiled via f2py for amplitude cross-checks ---
[feature.helas-validation.dependencies]
python = ">=3.10,<3.12"
numpy = "*"
gfortran = "*"

[feature.helas-validation.tasks]
# Compile HELAS .F files into a Python extension module (helas_f.so)
build-helas = "cd validation/helas && bash build.sh"
# Generate HELAS reference data: produces reference.npz and reference.csv
generate-helas = { cmd = "cd validation/helas && python gen_reference.py", depends-on = ["build-helas"] }
# Full pipeline: build f2py extension, generate reference data, then run extended Rust tests
validate-helas = { cmd = "cargo test -p vibegraph-lib --profile profiling --features extended-validation --test validate_helas", depends-on = ["generate-helas"] }

# --- MarkItDown: CLI tool for converting to markdown files ---
[feature.markitdown.dependencies]
python = ">=3.10,<3.12"
markitdown = "*"

[environments]
nougat = { features = ["nougat"], solve-group = "nougat" }
madgraph = { features = ["madgraph"], solve-group = "madgraph" }
helas-validation = { features = ["helas-validation"], solve-group = "helas-validation" }
markitdown = { features = ["markitdown"], solve-group = "markitdown" }

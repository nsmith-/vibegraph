[package]
name = "vibegraph-lib"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"

[lib]
name = "vibegraph"
path = "src/lib.rs"

[features]
extended-validation = []
# Exposes helas::eval::bench_internals (kernels + random-slot generators) for the
# kernel-granularity microbenches in benches/. Never enable in normal builds.
bench-internals = []

[dependencies]
num-traits = "0.2"
rand = "0.9"
rand_chacha = "0.9"
rayon = "1"
feyngraph = { git = "https://github.com/nsmith-/FeynGraph", branch = "main", default-features = false }
indexmap = { version = "2.14.0", features = ["serde"] }
log = "0.4.29"
num-complex = "0.4.6"
num-rational = "0.4"
peg = "0.8.6"
rustpython-parser = "0.3"
thiserror = "2.0.18"
itertools = "0.14.0"
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
zstd = "0.13"
strum = { version = "0.28.0", features = ["derive"] }
egglog = "2.0.0"
ordered-float = "5"
numeric-array = "0.6.1"
quick-xml = "0.32.0"
sha2 = "0.11.0"
dirs = "6"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
criterion = "0.5"
libm = "0.2"
libtest-mimic = "0.7"
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[[bench]]
name = "eval_strategies"
harness = false

[[bench]]
name = "kernel_fusion"
harness = false
required-features = ["bench-internals"]

# `required-features` is how a test declares its dependency layer: everything
# listed here needs the mg5amcnlo submodule, a fetched PDF set or a frozen
# MadGraph run, so it is absent from a default-feature build rather than
# deciding at runtime whether it has anything to do. See validation/manifest.toml.

[[test]]
name = "validate_madgraph_diagrams"
harness = false
required-features = ["extended-validation"]

[[test]]
name = "validate_helas_mg"
harness = false
required-features = ["extended-validation"]

[[test]]
name = "color_cf_oracle"
harness = false
required-features = ["extended-validation"]

[[test]]
name = "color_flow_tags_oracle"
harness = false
required-features = ["extended-validation"]

[[test]]
name = "color_jamp_oracle"
harness = false
required-features = ["extended-validation"]

[[test]]
name = "amp_diagram_oracle"
harness = false
required-features = ["extended-validation"]

[[test]]
name = "validate_sigma"
required-features = ["extended-validation"]

[[test]]
name = "validate_scale_couplings"
required-features = ["extended-validation"]

[[test]]
name = "validate_unweighting"
required-features = ["extended-validation"]

[[test]]
name = "validate_lhef"
required-features = ["extended-validation"]

[[test]]
name = "validate_helas"
required-features = ["extended-validation"]

[[test]]
name = "validate_alphas"
required-features = ["extended-validation"]

[[test]]
name = "validate_scales"
required-features = ["extended-validation"]

[[test]]
name = "validate_pdf_grid"
required-features = ["extended-validation"]

[[test]]
name = "validate_hadronic"
required-features = ["extended-validation"]

[[test]]
name = "validate_vegas"
required-features = ["extended-validation"]

[[test]]
name = "rambo_flat_mc"
required-features = ["extended-validation"]

[[test]]
name = "ufo"
required-features = ["extended-validation"]

[[test]]
name = "sm_interned_blob"
required-features = ["extended-validation"]


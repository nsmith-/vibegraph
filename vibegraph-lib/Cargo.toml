[package]
name = "vibegraph-lib"
version.workspace = true
edition.workspace = true

[lib]
name = "vibegraph"
path = "src/lib.rs"

[features]
extended-validation = []
# Exposes helas::eval::bench_internals (kernels + random-slot generators) for the
# kernel-granularity microbenches in benches/. Never enable in normal builds.
bench-internals = []

[dependencies]
num-traits = "0.2"
rand = "0.9"
feyngraph = { git = "https://github.com/nsmith-/FeynGraph", branch = "main", default-features = false }
indexmap = { version = "2.14.0", features = ["serde"] }
log = "0.4.29"
num-complex = "0.4.6"
num-rational = "0.4"
peg = "0.8.6"
rustpython-parser = "0.3"
thiserror = "2.0.18"
itertools = "0.14.0"
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
zstd = "0.13"
strum = { version = "0.28.0", features = ["derive"] }
egglog = "2.0.0"

[dev-dependencies]
criterion = "0.5"
libm = "0.2"
libtest-mimic = "0.7"
rayon = "1"
serde_json = "1.0"

[[bench]]
name = "eval_strategies"
harness = false

[[bench]]
name = "kernel_fusion"
harness = false
required-features = ["bench-internals"]

[[test]]
name = "validate_madgraph_diagrams"
harness = false
required-features = ["extended-validation"]

[[test]]
name = "validate_helas_mg"
harness = false
required-features = ["extended-validation"]

[package]
name = "vibegraph-lib"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"

[lib]
name = "vibegraph"
path = "src/lib.rs"

[features]
extended-validation = []
# Exposes helas::eval::bench_internals (kernels + random-slot generators) for the
# kernel-granularity microbenches in benches/. Never enable in normal builds.
bench-internals = []

[lints]
workspace = true

[dependencies]
num-traits = "0.2"
rand = "0.9"
rand_chacha = "0.9"
rayon = "1"
feyngraph = { git = "https://github.com/nsmith-/FeynGraph", branch = "main", default-features = false }
indexmap = { version = "2.14.0", features = ["serde"] }
log = "0.4.29"
num-complex = "0.4.6"
num-rational = "0.4"
peg = "0.8.6"
rustpython-parser = "0.3"
thiserror = "2.0.18"
itertools = "0.14.0"
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
zstd = "0.13"
strum = { version = "0.28.0", features = ["derive"] }
egglog = "2.0.0"
ordered-float = "5"
# The regularised incomplete gamma function, which the chi-squared p-value is:
# a dependency-free special-function crate rather than a hand-rolled series.
puruspe = "0.4"
numeric-array = "0.6.1"
quick-xml = "0.32.0"
sha2 = "0.11.0"
dirs = "6"
tar = "0.4"
flate2 = "1"
# Per-thread integrand scratch: the parallel integrator needs one evaluation
# arena and one set of amplitude constant pools per worker, reached through the
# `&self` a rayon closure shares. `std::thread_local!` cannot hold it — the
# scratch borrows the model and the compiled amplitudes, and `'static` is
# precisely what it is not.
thread_local = "1"

[dev-dependencies]
criterion = "0.5"
libm = "0.2"
libtest-mimic = "0.7"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# The validation gates read one flag out of validation/manifest.toml — which rows
# the pinned reference bundle carries. Same version the report collator parses it
# with, so the two cannot disagree about the manifest's shape.
toml = "1"

[[bench]]
name = "eval_strategies"
harness = false

[[bench]]
name = "kernel_fusion"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "pdf_xfx"
harness = false

# The amplitude gate reads committed per-process tables and needs nothing else,
# so it is hermetic; `harness = false` is only because it names one trial per
# process.
[[test]]
name = "amplitude_oracle"
harness = false

# The diagram gate is hermetic for the same reason: the committed
# `diagrams.json` and the committed `.mg5` scripts are all it reads. When a
# process directory happens to sit beside them it also prints that directory's
# configs.inc topologies, which asserts nothing and is skipped when the work
# area is absent.
[[test]]
name = "validate_madgraph_diagrams"
harness = false

# `required-features` is how a test declares its dependency layer: everything
# listed here needs the mg5amcnlo submodule, a fetched PDF set or a frozen
# MadGraph run, so it is absent from a default-feature build rather than
# deciding at runtime whether it has anything to do. See validation/manifest.toml.

[[test]]
name = "color_cf_oracle"
harness = false
required-features = ["extended-validation"]

[[test]]
name = "color_flow_tags_oracle"
harness = false
required-features = ["extended-validation"]

[[test]]
name = "validate_sigma"
required-features = ["extended-validation"]

[[test]]
name = "validate_scale_couplings"
required-features = ["extended-validation"]

[[test]]
name = "validate_unweighting"
required-features = ["extended-validation"]

[[test]]
name = "validate_samples"
required-features = ["extended-validation"]

[[test]]
name = "validate_lhef"
required-features = ["extended-validation"]

[[test]]
name = "validate_alphas"
required-features = ["extended-validation"]

[[test]]
name = "validate_scales"
required-features = ["extended-validation"]

[[test]]
name = "validate_kt_cluster"
required-features = ["extended-validation"]

[[test]]
name = "validate_pdf_grid"
required-features = ["extended-validation"]

[[test]]
name = "validate_hadronic"
required-features = ["extended-validation"]

[[test]]
name = "validate_vegas"
required-features = ["extended-validation"]

[[test]]
name = "rambo_flat_mc"
required-features = ["extended-validation"]

[[test]]
name = "ufo"
required-features = ["extended-validation"]

[[test]]
name = "sm_interned_blob"
required-features = ["extended-validation"]


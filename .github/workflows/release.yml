name: release

# Cuts precompiled binaries for a tagged version. `vibegraph --version` reports
# the tag itself (vibegraph-cli/build.rs runs `git describe`), so the checkout
# below needs full tag history rather than the default shallow clone.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# The build jobs only read the checkout; `publish` raises what it needs.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      # `asset`, not `target`, names the published file and keys the caches: two
      # legs below share one target triple and differ only in the instruction
      # set they are compiled for, so the triple alone is not a unique name.
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: vibegraph-aarch64-apple-darwin
            os: macos-15 # Apple Silicon runner: native build, no cross toolchain.
          - target: x86_64-apple-darwin
            asset: vibegraph-x86_64-apple-darwin
            # Intel runner: native build too, so this needs no Rosetta step.
            # `macos-15-intel` is the standard-runner Intel label, and the last
            # x86_64 macOS image Actions will offer — it retires in Fall 2027,
            # after which this leg has no host to build on and Intel Macs stop
            # being a supported target.
            os: macos-15-intel
          - target: x86_64-unknown-linux-musl
            asset: vibegraph-x86_64-unknown-linux-musl
            os: ubuntu-latest
            # musl over a glibc floor: the crate's only C dependency is
            # zstd-sys's bundled (not system) libzstd, so nothing else needs a
            # dynamic-linked system library. A musl binary is fully static and
            # runs unmodified on any x86_64 Linux kernel a user has, with no
            # "which glibc does this distro ship" support matrix to maintain -
            # exactly the "no dev toolchain" bar this sprint is aiming for.
            # The one added cost is musl-tools for musl-gcc, installed below.
          - target: x86_64-unknown-linux-musl
            asset: vibegraph-x86_64-unknown-linux-musl-v3
            os: ubuntu-latest
            # The same static musl binary, compiled for x86-64-v3 (AVX2, FMA,
            # BMI) instead of the baseline the triple implies. Opt-in: it is a
            # separate asset because it SIGILLs on anything older than roughly
            # Haswell/Excavator, so the plain triple has to stay the one that
            # runs everywhere. Worth publishing because the hot path here is
            # floating-point amplitude evaluation, which is what the wider
            # vector width buys. `ci.yml` builds and tests the whole workspace
            # under these same flags, so the runner is known to execute v3.
            rustflags: -C target-cpu=x86-64-v3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # `--` terminates the asset name: one asset name is a prefix of
          # another (`...-musl` of `...-musl-v3`), and a restore-key is a
          # prefix match, so a single dash would let the baseline leg restore
          # the v3 leg's cache.
          key: release-${{ matrix.asset }}--${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.asset }}--

      - name: cargo build --release
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }} --package vibegraph

      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/vibegraph"
          "$bin" --version

          # The binary ships bare, so `--version` is the only vehicle for the
          # license notices it is required to carry. Gate on the MadGraph
          # copyright line and on vibegraph's own MIT text actually being
          # emitted by the binary as built, not assumed from the source.
          "$bin" --version | grep -q "Copyright (c) 2009, 2013, the MadTeam"
          "$bin" --version | grep -q "Permission is hereby granted, free of charge"

          # A partonic (lpp = 0) process needs no PDF set, no UFO model file and
          # no network: the SM model is compiled into the binary. This is the
          # cheapest command that exercises diagram generation, HELAS
          # evaluation and VEGAS end to end on the binary as shipped.
          work="$(mktemp -d)"
          cat > "$work/proc_card.dat" <<'EOF'
          import model sm
          generate e+ e- > t t~
          EOF
          cat > "$work/run_card.dat" <<'EOF'
            0 = lpp1
            0 = lpp2
            250.0 = ebeam1
            250.0 = ebeam2
          EOF
          "$bin" integrate "$work/proc_card.dat" --run-card "$work/run_card.dat" \
            --out "$work/out" --neval 5000 --niter 2
          test -f "$work/out/grid.bin.zst"

      # Each release asset is the bare executable, ready to run after
      # `chmod +x` — no archive to unpack. The license notices (vibegraph's
      # MIT/Apache-2.0 texts and THIRD-PARTY-NOTICES for the interned
      # MadGraph5_aMC@NLO SM model) are compiled into the binary and printed by
      # `--version`, so they accompany every copy of the binary itself; the
      # publish job attaches the same files to the release alongside the
      # binaries for anyone who wants them without running it.
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/vibegraph" \
            "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # `contents` to create the release, `actions` to dispatch acceptance at the
    # end. Set here rather than at the top level so the build jobs keep the
    # read-only default.
    permissions:
      contents: write
      actions: write
    steps:
      # Checkout only to attach the license notice files next to the binaries.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: sha256sum vibegraph-* > SHA256SUMS

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/vibegraph-* dist/SHA256SUMS \
            LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES

      # `acceptance.yml` subscribes to `release: published`, but it will never
      # see the release created above: an event raised with the repository's
      # own GITHUB_TOKEN does not start a workflow run, precisely so a workflow
      # cannot trigger itself into a loop. `workflow_dispatch` is one of the two
      # documented exceptions to that rule, so ask for the run explicitly. The
      # `release` subscription stays for releases published by hand, which do
      # carry a user's token and do trigger it.
      - name: run acceptance against the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run acceptance.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f tag="${{ github.ref_name }}"

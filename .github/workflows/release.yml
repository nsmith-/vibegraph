name: release

# Cuts precompiled binaries for a tagged version. `vibegraph --version` reports
# the tag itself (vibegraph-cli/build.rs runs `git describe`), so the checkout
# below needs full tag history rather than the default shallow clone.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14 # Apple Silicon runner: native build, no cross toolchain.
          - target: x86_64-apple-darwin
            os: macos-13 # Intel runner: native build too, so this needs no
            # Rosetta step — macos-13 still ships real x86_64 hardware.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            # musl over a glibc floor: the crate's only C dependency is
            # zstd-sys's bundled (not system) libzstd, so nothing else needs a
            # dynamic-linked system library. A musl binary is fully static and
            # runs unmodified on any x86_64 Linux kernel a user has, with no
            # "which glibc does this distro ship" support matrix to maintain -
            # exactly the "no dev toolchain" bar this sprint is aiming for.
            # The one added cost is musl-tools for musl-gcc, installed below.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-

      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.target }} --package vibegraph

      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/vibegraph"
          "$bin" --version

          # A partonic (lpp = 0) process needs no PDF set, no UFO model file and
          # no network: the SM model is compiled into the binary. This is the
          # cheapest command that exercises diagram generation, HELAS
          # evaluation and VEGAS end to end on the binary as shipped.
          work="$(mktemp -d)"
          cat > "$work/proc_card.dat" <<'EOF'
          import model sm
          generate e+ e- > t t~
          EOF
          cat > "$work/run_card.dat" <<'EOF'
            0 = lpp1
            0 = lpp2
            250.0 = ebeam1
            250.0 = ebeam2
          EOF
          "$bin" integrate "$work/proc_card.dat" --run-card "$work/run_card.dat" \
            --out "$work/out" --neval 5000 --niter 2
          test -f "$work/out/grid.bin.zst"

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="vibegraph-${{ matrix.target }}"
          mkdir -p "$asset"
          cp "target/${{ matrix.target }}/release/vibegraph" "$asset/"
          # THIRD-PARTY-NOTICES travels inside every tarball, not just the repo:
          # the interned SM model (vibegraph-lib/src/ufo/sm_assets/) is
          # MadGraph5_aMC@NLO material compiled into this binary, and its
          # license's redistribution-in-binary-form clause requires the notice
          # to accompany the distributed binary itself.
          cp THIRD-PARTY-NOTICES "$asset/"
          tar czf "dist/$asset.tar.gz" "$asset"

      - uses: actions/upload-artifact@v4
        with:
          name: vibegraph-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: create release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            *.tar.gz SHA256SUMS

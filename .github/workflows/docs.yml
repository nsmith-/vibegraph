name: docs

# The documentation site — the mdBook under docs/, the rustdoc API reference
# for vibegraph-lib, and the CLI reference generated from the binary's own
# `--help` — assembled by `scripts/build-docs.sh` into target/site/ and
# published to GitHub Pages. Pull requests build the site without deploying,
# so a broken page or a stale API link is a red check before it is a broken
# site. Publishing needs the repository's Pages source set to "GitHub Actions"
# (Settings → Pages) once; the deploy job fails with a clear message until then.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a queued one is never cancelled: cancelling a
# deployment in flight can leave the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

# The same codegen flags as ci.yml, so `Swatinem/rust-cache` keys this job's
# compiled dependencies identically to the hermetic test job's and the build
# of the CLI (needed for its `--help` text) restores from that cache.
env:
  RUSTFLAGS: -C target-cpu=x86-64-v3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hermetic
          cache-on-failure: true

      # A prebuilt release rather than `cargo install`, which would compile
      # mdBook and its dependency tree on every run.
      - name: Install mdBook
        env:
          MDBOOK_VERSION: v0.4.52
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: scripts/build-docs.sh

      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

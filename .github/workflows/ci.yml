name: ci

# Two of the three dependency layers described in `validation/manifest.toml`.
#
# `test` is the **hermetic** layer: `cargo test` with no features, against a
# checkout with no submodules and none of the fetched or MadGraph-generated data
# under `validation/`. It is *complete* there — every test the default-feature
# build registers runs and asserts, and none of them skips. One mechanism keeps
# it that way: a test needing the `mg5amcnlo` submodule, a fetched PDF set or a
# frozen MadGraph run carries `required-features = ["extended-validation"]` in
# its crate's `Cargo.toml`, so it is absent from this build entirely rather than
# deciding at runtime whether it has anything to do. (The structural exception is
# the `--lib` target, which has no per-test registration; the few library unit
# tests needing banked inputs use `#[cfg(feature = "extended-validation")]`.)
#
# `banked` is the **banked** layer: submodule checked out, reference data
# fetched, `pixi run validate`. It is not a merge gate yet — the reference bundle
# has a fetch seam but no published asset, so this job runs without the frozen
# MadGraph runs and its gates fail naming them. `continue-on-error` marks that;
# removing it goes with publishing the asset and adding `pixi run fetch-refdata`
# to the fetch step below.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Compiled dependencies + the crate registry, keyed on Cargo.lock and the
      # toolchain, with stale target artifacts pruned before saving — so the
      # dependency graph compiles once per lockfile change, not once per push.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hermetic
          cache-on-failure: true

      # `cargo test` compiles everything `cargo build` would, plus the
      # dev-dependencies and test binaries; a separate build step adds a
      # second compile wave without adding coverage.
      - run: cargo test --locked --workspace

  banked:
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          environments: default
          cache: true

      # Separate cargo cache from the hermetic job's: this layer compiles under
      # the release-debug profile, so the two jobs share no artifacts.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: banked
          cache-on-failure: true

      # Fetched reference data is not a cargo artifact: cached on the fetch
      # scripts, so a changed pin re-fetches and nothing else does.
      - uses: actions/cache@v4
        with:
          path: validation/pdf
          key: refdata-${{ hashFiles('validation/pdf/fetch.sh', 'validation/fetch_common.sh') }}

      # Downloads are a step of their own rather than something a test triggers
      # by reaching for a file it cannot find, so what this job pulls from the
      # network is visible in the log without reading any Rust.
      - name: Fetch reference data
        run: pixi run fetch-pdf

      # The task ends with the collator, so a green run here says the rendered
      # report matched the manifest's declared cell set as well as that every
      # gate passed.
      - name: Banked validation layer
        run: pixi run --skip-deps validate

      # Uploaded whichever way the step above went: when a gate fails, the
      # report is how the failing cell is read off without going through the log.
      - name: Upload the validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: target/validation-report/
          if-no-files-found: warn

name: ci

# Two of the three dependency layers described in `validation/manifest.toml`.
#
# `test` is the **hermetic** layer: `cargo test` with no features, against a
# checkout with no submodules and none of the fetched or MadGraph-generated data
# under `validation/`. It is *complete* there — every test the default-feature
# build registers runs and asserts, and none of them skips. One mechanism keeps
# it that way: a test needing the `mg5amcnlo` submodule, a fetched PDF set or a
# frozen MadGraph run carries `required-features = ["extended-validation"]` in
# its crate's `Cargo.toml`, so it is absent from this build entirely rather than
# deciding at runtime whether it has anything to do. (The structural exception is
# the `--lib` target, which has no per-test registration; the few library unit
# tests needing banked inputs use `#[cfg(feature = "extended-validation")]`.)
#
# `banked` is the **banked** layer: submodule checked out, reference data
# fetched (PDF sets + the pinned `refdata` bundle, a release asset), then
# `pixi run validate`, which ends with the report collator. It is a merge gate:
# every input is fetchable on a fresh runner, so a red cell is a red check.
#
# On a pull request, `banked` runs only when the diff touches something the
# layer reads. The `changes` job decides with `scripts/banked-inputs-changed.sh`:
# the job is skipped only when every changed file is on that script's skip list
# (`research/kb/`, the mdBook outside `docs/src/cli/`, agent prompts, README
# media, Markdown outside the crates and `validation/`). A skipped job reports
# as passing to a required check, so the check keeps its name, and the
# `changes` job's summary says "banked skipped: no banked-layer inputs changed".
# Any doubt (no base, a failed diff, an empty diff, `changes` itself failing)
# runs it. Pushes to `main` always run it.
on:
  push:
    branches: [main]
  pull_request:

# The two compiling jobs below run on `ubuntu-latest`, which is x86_64, and both
# exist only to compile and run this repository's own tests — nothing either of
# them builds is distributed. Raising the codegen floor from the x86-64 baseline to v3 (AVX2 +
# FMA, which every GitHub-hosted x86_64 runner has) lets the amplitude and VEGAS
# arithmetic that dominates the suite's wall time vectorise. `release.yml`
# deliberately does not set this: its binaries ship to users, and must keep
# running on baseline x86-64 hardware.
#
# `Swatinem/rust-cache` folds this into its own cache key without help — its
# `env-vars` default (`CARGO CC CFLAGS CXX CMAKE RUST`) is matched by prefix, so
# `RUSTFLAGS` already contributes to the environment hash. The `actions/cache`
# step below is keyed on the fetch scripts and the manifest pin and caches no
# compiler output, so it is unaffected.
env:
  RUSTFLAGS: -C target-cpu=x86-64-v3

jobs:
  # Formatting is checked here rather than in a local hook because the sprint
  # workflow runs agents in `git worktree` checkouts, which share `.git/hooks`
  # with nothing and are cloned by no one — a hook installed in one working copy
  # governs neither the others nor a fresh clone. This job is the only place the
  # rule is enforced for everybody. It compiles nothing, so it runs in seconds
  # and needs no cargo cache.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  # The research notes are an OKF knowledge bundle: every concept parses with a
  # non-empty `type`, every backlog item carries the keys the backlog view reads,
  # and the generated index files are current. Compiles nothing.
  kb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.63.2
          environments: kb
          cache: true

      - run: pixi run kb-lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Compiled dependencies + the crate registry, keyed on Cargo.lock and the
      # toolchain, with stale target artifacts pruned before saving — so the
      # dependency graph compiles once per lockfile change, not once per push.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hermetic
          cache-on-failure: true

      # Clippy runs here rather than in `fmt` or a job of its own because this
      # is the job that already has the cache and target directory it needs: it
      # lints the same crate graph `cargo test` is about to build, so it costs a
      # check pass over dependencies compiled a step later anyway, not a second
      # runner rebuilding all of them. (`fmt` deliberately compiles nothing,
      # which is what makes it finish in seconds.) `--all-targets` reaches the
      # test and binary targets, where the lints about test placement and
      # test-only code are the only ones that can fire. `-D warnings` is what
      # makes the step mean anything: clippy exits 0 over warnings, so without
      # it a lint that had drifted would stay advisory and the job would go
      # green across a growing pile of them.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `cargo test` compiles everything `cargo build` would, plus the
      # dev-dependencies and test binaries; a separate build step adds a
      # second compile wave without adding coverage.
      - run: cargo test --locked --workspace

  # Whether `banked` has anything to check. Outputs `run=false` only on a pull
  # request whose every changed file is on the skip list; the list and its
  # reasons are in the script.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "banked: run: $GITHUB_EVENT_NAME event"
            decision=run=true
          else
            decision=$(bash scripts/banked-inputs-changed.sh "$BASE" HEAD) || decision=run=true
          fi
          [ "$decision" = run=false ] || decision=run=true
          echo "$decision" >> "$GITHUB_OUTPUT"
          if [ "$decision" = run=false ]; then
            {
              echo "banked skipped: no banked-layer inputs changed"
              echo
              git diff --no-renames --name-only "$BASE...HEAD" | sed 's/^/    /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # `!cancelled()` replaces the implicit `success()`, so a failed `changes` job
  # (empty output) runs the layer rather than skipping it; `test` must still
  # have passed.
  banked:
    needs: [test, changes]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      # `pixi-version` pinned to the version that writes `pixi.lock` locally:
      # the action's default pixi is older and rejects lock files the current
      # tool considers up-to-date.
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.63.2
          environments: default
          cache: true

      # Separate cargo cache from the hermetic job's: this layer compiles under
      # the release-debug profile, so the two jobs share no artifacts.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: banked
          cache-on-failure: true

      # Fetched reference data is not a cargo artifact: cached on the fetch
      # scripts and the manifest pin, so a changed pin re-fetches and nothing
      # else does.
      - uses: actions/cache@v6
        with:
          path: |
            validation/pdf
            validation/madgraph/output
          key: refdata-${{ hashFiles('validation/pdf/fetch.sh', 'validation/fetch_common.sh', 'validation/fetch_refdata.sh', 'validation/manifest.toml') }}

      # Downloads are a step of their own rather than something a test triggers
      # by reaching for a file it cannot find, so what this job pulls from the
      # network is visible in the log without reading any Rust. The bundle is a
      # release asset of this repository, fetched with the workflow token rather
      # than anonymously so the step keeps working whatever the repository's
      # visibility is.
      - name: Fetch reference data
        env:
          VIBEGRAPH_FETCH_CONSENT: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          pixi run fetch-pdf
          pixi run fetch-pdf-multigrid
          pixi run fetch-refdata

      # The task ends with the collator, so a green run here says the rendered
      # report matched the manifest's declared cell set as well as that every
      # gate passed.
      - name: Banked validation layer
        run: pixi run --skip-deps validate

      # The rendered table, in the run's own summary page: a failing cell is then
      # readable from the check itself, without downloading the artifact below.
      # `always()` because a red gate is exactly when it is worth reading.
      - name: Validation report to job summary
        if: always()
        run: |
          set -euo pipefail
          report=target/validation-report/report.md
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "report not produced: $report is missing (the collator did not run)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Uploaded whichever way the step above went: when a gate fails, the
      # report is how the failing cell is read off without going through the log.
      - name: Upload the validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: target/validation-report/
          if-no-files-found: warn

[package]
name = "vibegraph-validation-report"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false
# Two binaries: the collator, which `cargo run -p vibegraph-validation-report`
# runs, and `seed-record`, which writes a MadEvent seed record for
# `validation/madgraph/bank_seeded_sigma.sh`.
default-run = "validation-report"

# The collator is a development tool, not part of what the crate ships: it reads
# the row files the validation gates wrote and renders the report. It depends on
# nothing of vibegraph's own, which is what keeps it buildable on a bare clone.
[[bin]]
name = "validation-report"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml = "1"
# The chi-squared survival function behind the seed record's chance-exceedance
# count (the regularised upper incomplete gamma function), as vibegraph-lib uses
# it; its continued fraction does not truncate in the deep tail.
statrs = { version = "0.19", default-features = false }

[dev-dependencies]
# Scratch directories for seed-record's tests, removed when a test ends or fails.
tempfile = "3"

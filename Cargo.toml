[package]
name = "vibegraph"
version = "0.1.0"
edition = "2024"

[lib]
name = "vibegraph"
path = "src/lib.rs"

[[bin]]
name = "vibegraph"
path = "src/main.rs"

[features]
extended-validation = []

[dependencies]
num-traits = "0.2"
rand = "0.9"
feyngraph = { path = "research/refs/feyngraph", default-features = false }
indexmap = "2.14.0"
log = "0.4.29"
num-complex = "0.4.6"
num-rational = "0.4"
peg = "0.8.6"
rustpython-parser = "0.3"
thiserror = "2.0.18"
itertools = "0.14.0"

[dev-dependencies]
libm = "0.2"

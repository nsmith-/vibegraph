integrals = { tier = "banked", mode = "gate", note = "pp_to_llj_dyn's run card with mmll back at 0 and nothing else changed, so this row is the low lepton-pair-mass region its enforced twin is carded away from -- the one place a banked cross section is drawn from the photon-pole side of m_ll, regulated by ptl = 10 alone. That region is the hardest budget on any row here, and the only ladder on any hadronic row that still moves in one direction: five seeds a rung read +0.04% / +0.07% / +0.11% / +0.21% at 75k / 150k / 300k / 600k with chi2/dof 1.49 / 0.65 / 0.33 / 0.46. The rise is monotone over the whole eightfold range rather than a low-rung artefact, so no budget cut is licensed here whatever the reference's precision would allow -- the answer to a climbing ladder is never a cheaper rung and never a wider tolerance. It stays at 150000 x 10, the rung above the one whose error is inflated to 0.29% by a single seed. What bounds the climb is that its whole span is 0.17%, half the reference's own 0.33%, so the comparison cannot resolve it. At the gate budget sigma = 5.055595e2 +- 7.545e-1 pb against MadGraph's 5.046300e2 +- 1.674e0: pull +0.51, rel +0.18%, chi2/dof 0.49. rel_tol 0.005 from the reference's own 0.33% Monte-Carlo error. What this cannot see is a clustering wrong per event but right on average -- validate_scales replays all 10000 events' SCALUP / <rscale> / <pdfrwt>, and validate_kt_cluster reproduces the merge sequences behind them" }

[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate", note = "no per-diagram table: 579 and 615 diagrams over 256 helicity combinations is megabytes per point, so the linear-level comparison is the per-helicity coherent amplitude" }
integrals = { tier = "long", mode = "info", note = "measured in the oracle layer rather than the banked one, for budget and not for dependencies: pixi run validate-sigma-2to6 is its driver and pixi run validation-report collates the cell it writes. The skip this replaced blamed a ~1 ms matrix element over a 24-dimensional map and both halves were wrong. One integration point through the gate's own harness costs 64.1 us at uniform alpha (probe_2to6_eval_cost, one core, min of three rounds) against 48.0 us under the flat map, so the evaluator is not what kept the row out. What does is the floor: 579 per-diagram channels at MIN_CHANNEL_NEVAL = 512 apiece is 296448 evaluations an iteration however small the budget asked, so the cheapest meaningful run of this row is already ~2.4M points. And the flat map is no cheaper alternative -- it is no alternative. Over a 24-dimensional uniform draw this cross section comes back as 1.844815e-18, 4.207843e-15, 1.276977e-15 and 1.776916e-17 pb at 100000, 200000, 400000 and 800000 points an iteration against MadGraph's 7.1428e-7, with the five seeds of every rung scattered over eighteen orders of magnitude -- not a ladder climbing towards the answer. And it is not an acceptance problem, which is the tempting explanation: this row's own coverage sweep accepts 46487 of 100000 flat draws. The cuts are reached; the integrand is not. Six outgoing legs put the Z poles and the regulated photon edge on a set of vanishing flat measure, so a uniform draw lands in the fiducial region routinely and essentially never where the cross section lives. Under the per-diagram multichannel the physics agrees and the estimator does not hold still. Five seeds a rung at 300000, 600000 and 1200000 points an iteration (probe_2to6_budget_ladder) put the five-seed mean at +1.08%, +0.36% and +0.62% of the bank -- agreement at the level of a reference whose own error is 0.30%. Individual seeds do not follow: one seed lands +4.8% at 300000 and the spread is +/-0.5% at the two rungs above. The excursions come in both signs, they appear at the top of the ladder as well as its bottom, and they do not shrink with budget, which is what says they are a heavy tail the per-channel grids never resolve rather than a convergence still running. chi2/dof over the seeds runs 0.76 to 13.3 with no order in it, so err_vg does not see the tail either -- and VEGAS's own per-iteration chi2/dof on these rows overflows to ~1e250, because a channel-split over hundreds of channels leaves terms that are identically zero in some iterations and denormal in others, and the statistic divides by a variance floored at the smallest positive double. That number is reported and is not a statistic; the seed-to-seed chi2/dof from the ladder is. A gate spends one seed, so covering a 4.8% excursion would take a tolerance near 0.10, which bounds nothing, and no budget this side can afford removes it: the row is therefore MEASURED AND REPORTED, NOT ENFORCED -- the middle rung of the enforcement ladder, taken deliberately and with the sweep that licenses it recorded here rather than absorbed into a widened tolerance. The single-seed run at the 600000 x 8 budget reads sigma = 7.132016e-7 +- 2.175e-9 pb against MadGraph's 7.142800e-7 +- 2.167e-9, pull -0.35, rel -0.15%. 600000 is the lowest rung whose whole sweep stayed inside 1.2%. What has to change before a bound goes on is the tail, not the tolerance: fewer channels, a Neyman allocation that gives the surviving ones enough points to train a 15-dimensional grid, or a maximum rule that sees the tail" }
samples = { tier = "long", mode = "gate", note = "still the oracle layer's, and now for a measured cost rather than an assumed one. probe_2to6_sample_cost drives this row's real accept/reject loop off its own scanned maxima under the production truncation rule: acceptance 8.561e-3, 117 trials an event, 29.2% of the 400-trial budget the samples gate allows before it calls a seed short -- so nothing about this row's efficiency stops it being generated. What stops it is wall time in a place no core count helps: the accept/reject loop advances one RNG trial by trial, so it is serial by construction, and the gate's three seeds of 20000 events cost 1577 s of it here on top of 148 s of grids and w_max scan (measured with a second integration sharing the host, so the parallel half is pessimistic and the serial half is not). Both rows together are ~40 minutes of unparallelisable generation against a 391 s banked layer. The number is the blocker and it is recorded here so the session that flips this cell starts from it rather than from an estimate; the integrals cell beside it is already driven, by pixi run validate-sigma-2to6" }


# vibegraph validation manifest.
#
# One row per validated process: what it is, which script builds its MadGraph
# reference, which artifacts that reference consists of, why the process is in
# the set at all, and — per validation category — which dependency layer the
# check runs in. This is the single source of truth the reference generators,
# the report driver and the `validation/madgraph` index read from, so a process
# is added here once rather than in five places.
#
# ## Layers
#
# A check declares its layer by *where it is registered*, never at runtime:
#
#   hermetic  Runs on a bare clone — no git submodule, no fetched data, no pixi
#             environment, no network. `cargo test` with default features is
#             exactly this set, and it is complete there: it never skips.
#   banked    May assume the `mg5amcnlo` submodule checked out, the fetched PDF
#             sets, and the frozen MadGraph reference runs. May *not* run
#             MadGraph. Registered with `required-features = ["extended-validation"]`
#             in the crate manifests; driven by `pixi run validate`.
#   oracle    May run `mg5_aMC`, LHAPDF and f2py. Holds all reference generation
#             plus the vibegraph-side runs too heavy for the banked budget.
#             Driven by `pixi run generate-references` / `pixi run validate-deep`.
#
# The one structural exception to "registration is the mechanism": a library
# unit test lives in the `--lib` target, which has no per-test registration, so
# the handful of `--lib` tests that need banked inputs carry
# `#[cfg(feature = "extended-validation")]` instead. Integration tests never do.
#
# The banked layer takes no runtime skips. Its inputs — the submodule, the two
# PDF sets, the reference bundle — are acquired by `pixi run validate`'s own
# dependency tasks, each of which fails when it cannot acquire what it names, so
# a gate that still finds one missing calls `vibegraph::validation::require` and
# fails naming the input.
#
# ## Categories and cell tiers
#
# Four per-process categories: `diagrams` (same Feynman diagrams as MadGraph),
# `amplitudes` (per-point × per-helicity × per-flow complex amplitudes),
# `integrals` (sigma against banked MadGraph), `samples` (unweighted-event
# distributions against MadGraph's banked event samples).
#
# Each cell carries a `tier`:
#
#   hermetic / banked / long   the layer the cell's gate runs in ("long" is the
#                              oracle layer, entered for cost rather than for
#                              dependencies). This is where the gate is
#                              *registered*, not the weakest layer it could run
#                              in.
#   blocked                    not runnable until `blocker` lands
#   covered-by                 deliberately not measured here; `rows` names the
#                              rows that cover the same physics
#   uncovered                  a named gap: nothing measures this and nothing
#                              claims to; `note` says what would fill it
#
# and a `mode`: `gate` (a failure fails the suite) or `info` (measured and
# reported, never enforced). `blocked` / `covered-by` / `uncovered` cells carry
# no mode.
#
# An `amplitudes` cell may also carry `factorized`: whether its colour-flow
# comparison had to be weakened from the full per-helicity x per-flow outer
# product to the two projections of it, which is the allowance a flow basis
# differing from MadGraph's would need. It is stated wherever the question was
# asked, so "not needed" is on the record rather than assumed.
#
# `status = "planned"` marks a row whose reference run does not exist yet, and
# `bundled = false` a row whose banked artifacts exist in a local work area but
# are not yet in the pinned reference bundle, so a fetching checkout does not have
# them and the next bundle has to pick them up.

schema = 1

# ──────────────────────── the banked-reference bundle ────────────────────────
#
# What the banked layer fetches instead of running MadGraph: the frozen event
# files with their banners and logs, the run and parameter cards, each
# subprocess's `leshouche.inc` and `matrix1_orig.f`, the per-channel integration
# logs the `alpha_s` source rule is read out of, the combined `results.dat`, and
# the fixed-grid amplitude tables. It unpacks into
# `validation/madgraph/output/`, so a fetching checkout and a machine that
# generated the runs itself present the gates with the same paths.
#
# `sha256` is the contract. `validation/madgraph/assemble_bundle.sh` rebuilds the
# archive byte-identically from a given work area, and
# `validation/fetch_common.sh` verifies the hash wherever the bytes came from —
# a release asset, or a local file named by $VIBEGRAPH_REFDATA_SOURCE. Changing
# the reference runs means a new `n`, a new archive and a new pin here.

[refdata]
version = 4
archive = "vibegraph-refdata-4.tar.zst"
url = "https://github.com/nsmith-/vibegraph/releases/download/refdata-4/vibegraph-refdata-4.tar.zst"
sha256 = "c8ef939ec6336fe53015115b7c3194604b1bd2f7cc6b52b5d21be69a82a325e9"
size_bytes = 118015652
unpacks_to = "validation/madgraph/output"
# Every run in this bundle is MadGraph 3.7.1's except the six that measure a
# 3.5.7 defect (the `ee_to_mumu_tata_qcd0` window/anti-window/control runs and
# `var_sde1`), which are the evidence and stay at the version they measure.
#
# While the repository is private, the plain `url` serves 404 to unauthenticated
# clients and the fetch falls back to an authenticated `gh release download` of
# the same asset; $VIBEGRAPH_REFDATA_SOURCE still overrides both for a local
# bundle.
published = true

# ─────────────────────────── single-channel rows ────────────────────────────
#
# One concrete subprocess each, so the matrix element is MadGraph's `matrix1`
# and a per-diagram or per-flow dump means one diagram (one flow) per row.
# Validating concrete subprocesses is deliberate: MadGraph's grouping of
# subprocesses is optimization-inspired, not physics-motivated, and we owe
# agreement with it only where it affects our ability to validate.

[[process]]
key = "ee_to_mumu"
process = "e+ e- > mu+ mu-"
script = "validation/madgraph/scripts/ee_to_mumu.mg5"
class = "single-channel"
n_final = 2
rationale = "The smallest complete amplitude: colourless massless s-channel gamma*/Z, the reference point every convention change is re-measured against."
artifacts = ["output/ee_to_mumu", "output/ee_to_mumu.json", "output/ee_to_mumu_amplitude.csv", "sigma_reference.json#ee_to_mumu", "amplitudes/ee_to_mumu.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate" }
samples = { tier = "banked", mode = "gate" }

[[process]]
key = "ee_to_ee"
process = "e+ e- > e+ e-"
script = "validation/madgraph/scripts/ee_to_ee.mg5"
class = "single-channel"
n_final = 2
rationale = "Bhabha: s+t interference with identical initial/final flavours, the sharpest regression for crossed-line conjugation and the relative sign between crossed diagram classes."
artifacts = ["output/ee_to_ee", "output/ee_to_ee.json", "output/ee_to_ee_amplitude.csv", "sigma_reference.json#ee_to_ee", "amplitudes/ee_to_ee.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate", note = "the run-card lepton pT cut regulates the t-channel divergence" }
samples = { tier = "banked", mode = "gate" }

[[process]]
key = "ee_to_ttx"
process = "e+ e- > t t~"
script = "validation/madgraph/scripts/ee_to_ttx.mg5"
class = "single-channel"
n_final = 2
rationale = "Massive external fermions: the massive-fermion spinor conventions in ixxxxx/oxxxxx that no massless continuum process touches. Beams at 500 GeV clear 2*MT."
artifacts = ["output/ee_to_ttx", "output/ee_to_ttx.json", "output/ee_to_ttx_amplitude.csv", "sigma_reference.json#ee_to_ttx", "amplitudes/ee_to_ttx.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate" }
samples = { tier = "banked", mode = "gate" }

[[process]]
key = "ee_to_wpwm"
process = "e+ e- > w+ w-"
script = "validation/madgraph/scripts/ee_to_wpwm.mg5"
class = "single-channel"
n_final = 2
rationale = "Triple-gauge (VVV) vertex plus massive charged vector externals (three helicity states each) and t-channel neutrino exchange: where the V-chain phase ledger first meets VVV."
artifacts = ["output/ee_to_wpwm", "output/ee_to_wpwm.json", "output/ee_to_wpwm_amplitude.csv", "sigma_reference.json#ee_to_wpwm", "amplitudes/ee_to_wpwm.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate" }
samples = { tier = "banked", mode = "gate" }

[[process]]
key = "ee_to_zh"
process = "e+ e- > z h"
script = "validation/madgraph/scripts/ee_to_zh.mg5"
class = "single-channel"
n_final = 2
rationale = "Higgsstrahlung: external scalar wavefunction (sxxxxx) on an on-shell VVS vertex, complementing the internal-Higgs ZZH class of the 2->6 continuum."
artifacts = ["output/ee_to_zh", "output/ee_to_zh.json", "output/ee_to_zh_amplitude.csv", "sigma_reference.json#ee_to_zh", "amplitudes/ee_to_zh.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate" }

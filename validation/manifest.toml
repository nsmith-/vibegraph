artifacts = ["output/pp_to_llj_dyn", "output/pp_to_llj_dyn/Events/run_01/unweighted_events.lhe.gz"]
[process.categories]
diagrams = { tier = "covered-by", rows = ["pp_to_llj_fixed", "pp_to_llj"] }
amplitudes = { tier = "covered-by", rows = ["uux_to_epemg", "ddx_to_epemg", "gu_to_epemu", "gux_to_epemux"] }
integrals = { tier = "banked", mode = "gate", note = "the row where the scale prescription is the only thing under test, and the fixed-scale twin held enforced at 0.5% is what makes the attribution sound: the two run cards differ in the three fixed_*_scale booleans and in nothing else. Each point's cluster scale is taken in the integration configuration drawn from that point's own squared amplitudes, AMP2_c / sum_i AMP2_i, inside the flavour group the point was sampled in -- MadEvent's single-diagram enhancement weight under this card's SDE_strategy = 1 and tmin_for_channel at its -1 default, the conjunction where get_channel_cut returns 1 and the enhancement weight AMP2_c * CC_c collapses to AMP2_c alone. The row has read three numbers under three rules: -3.05% while every point was clustered in channel 1, -0.68% while the scale was read in the channel the sampler drew the point in, and +0.12% now, over five seeds at 150000 x 10 at chi2/dof 2.49 -- the same five the ladder sweeps, so the gate and its bound carry the same degrees of freedom. Over five seeds at 75000/150000/300000/600000 points (probe_llj_dyn_budget_ladder) sigma = 416.3867 +- 0.4863, 415.9275 +- 0.2926, 416.3096 +- 0.1986, 416.0619 +- 0.1251 pb against MadGraph's 415.42 +- 1.36 -- flat to 0.11% across an eightfold budget, with no direction to it, at chi2/dof 0.64, 2.49, 3.28, 0.56. That is what says the residual is the reference's own error rather than a budget the row has yet to spend, and it is why the gate runs at 150000 x 10 rather than at 300000. It is also why the gate does not run at 75000, which the reference's 0.33% would otherwise license three times over: the seeds scatter more at the coarse rungs than the quoted errors alone suggest -- chi2/dof runs 0.64, 2.49, 3.28, 0.56 up the ladder rather than falling monotonically -- and seed scatter is a floor no precision argument crosses. rel_tol 0.005 is MadGraph's own 0.33% on this run with headroom, and not the achieved central value, which is
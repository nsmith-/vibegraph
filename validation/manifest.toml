amplitudes = { tier = "covered-by", rows = ["uux_to_epemg", "ddx_to_epemg", "gu_to_epemu", "gux_to_epemux"] }
integrals = { tier = "banked", mode = "gate", note = "the row where the scale prescription is the only thing under test, and the fixed-scale twin held enforced at 0.5% is what makes the attribution sound: the two run cards differ in the three fixed_*_scale booleans and in nothing else. Each point is now clustered in the channel its own sampling channel names, per flavour group -- the groups of this process do not share a merge graph, and the integrand had been using group 0's forests for all of them. Over five seeds at 75000/150000/300000/600000 points (probe_llj_dyn_budget_ladder) sigma = 409.554 +- 0.357, 411.393 +- 0.247, 412.529 +- 0.172, 412.950 +- 0.121 pb, rising with increments that halve (+1.84, +1.14, +0.42) and the last rung's five seeds agreeing at chi2/dof 0.09 with a 0.05% spread, so it is converged and seed-stable at about 413 pb against MadGraph's 415.42 +- 1.36 -- rel -0.59% at the top rung and -0.68% at this layer's own three seeds at 300k. It read -3.05% while every point was clustered in channel 1. rel_tol 0.015 is the channel-partition ambiguity of the gu_to_epemu cell (1.5% between this crate's converged and uniform partitions, on the partonic rows whose scale the channel actually moves) diluted by the flavour groups that do not carry it, with headroom, and above MadGraph's own 0.33% on this run. The pull is reported and NOT asserted: the residual is a systematic of about 0.6%, so its pull grows without bound as this side's budget rises while the disagreement stays put" }
samples = { tier = "uncovered", note = "nothing refuses this any more -- the integrals cell above now runs to a cross section -- and nothing measures it either. A proton-beam samples row is generated through the shipped binary (validate_samples_proton), which today integrates and generates the fixed-scale card only; the dynamical card needs its own artifact and its own generation pass. Deferred rather than refused, and worth taking together with whatever fixes the integration-channel deficit that cell records" }

[[process]]
key = "pp_to_jj"
process = "p p > j j"
script = "validation/madgraph/scripts/pp_to_jj.mg5"
class = "multi-channel"
n_final = 2
rationale = "The canonical leading-order QCD process on MadGraph's shipped run-card defaults — the run card departs from them in pdlabel and lhaid alone, because the MG-internal nn23lo1 is not an LHAPDF6 grid this crate's PDF layer can read. The only row whose flavour group mixes subprocesses with unequal identical-particle symmetry factors (g g > g g and q q~ > g g carry 1/2 where q g > q g and g g > q q~ carry 1), and its scale is the general clustering case rather than a degenerate one: a 2 -> 2 core of massless coloured legs where no closed form collapses the prescription."
artifacts = ["output/pp_to_jj", "output/pp_to_jj/Events/run_01/unweighted_events.lhe.gz"]
[process.categories]
diagrams = { tier = "uncovered", note = "the run's counts are not in diagrams.json: enumerated against them this side finds 15 unique topologies to MadGraph's 17, and the whole deficit is the g g > g g subprocess (4 against 6) — the four-gluon vertex written once here and once per colour structure there, which is the difference gg_to_gg already carries informationally and which its per-flow amplitude gate pins at 1e-13. Banking the counts means declaring the row informational for the same reason. What *is* compared, and enforced, is the concrete-subprocess set rather than the topology counts: jj_subprocesses_are_madgraphs_own reads the run's own leshouche.inc and finds the two sets equal — MadGraph's 65 assignments, entry for entry, each with its outgoing legs in MadGraph's own order. This is the row where the enumeration's unordered-outgoing rule bites (52 of the 65 have two different outgoing flavours, and neither side lists the swap), so the set equality is what keeps the two cells below honest about what they are summing over" }
amplitudes = { tier = "uncovered", note = "gg_to_gg and uux_to_uux cover two of its subprocesses; g q > g q, q q~ > g g and g g > q q~ would need parton rows of their own" }
integrals = { tier = "banked", mode = "gate", note = "the canonical leading-order QCD process on MadGraph's shipped run-card defaults, and the row that needs the whole chain at once: a per-event kT cluster scale read in the integration channel each point was drawn in, over a flavour decomposition whose members carry unequal identical-particle symmetry factors, on a mixed subprocess set. It sums over MadGraph's own 65 concrete assignments, asserted entry for entry against the run's leshouche.inc by jj_subprocesses_are_madgraphs_own -- this is the row where the enumeration's unordered-outgoing rule matters, and a scalar cross section is far too coarse to see a subprocess counted twice as anything but a normalisation, which is why the set comparison is a separate enforced statement rather than an inference from this one. rel_tol 0.005 is the reference's own 0.22% Monte-Carlo error (1.4726e6 on 6.7885e8 pb) with headroom, NOT the channel-partition band the llj rows carry: probe_jj_channel_partition measures the partition gap at 1.0e-3 against its own 9.6e-4 Monte Carlo, because a 2 -> 2 final state gives the clustering no merge to choose and mu_R and both mu_F are functions of the momenta alone. The pull is asserted rather than reported for the same reason, and the arithmetic makes it safe: MadGraph's error on this run is 1.47e6 pb against this side's 2.5e5 at the gate budget, so the combined error is essentially the reference's and a budget increase cannot drive the pull up. Three seeds at 300k here; the oracle-layer five-seed ladder reads +0.16% / +0.21% / +0.22% / +0.27% at 75k / 150k / 300k / 600k, a 0.11% climb across an eightfold budget against the 0.82% pp_to_llj_dyn climbs over the same range. That climb is half the reference's own error and is not resolved into an asymptote, so the row is converged at the scale the comparison is made at rather than demonstrably asymptotic -- what the cell cannot see is a residual below 0.2%. Nor can it see a clustering that got individual events wrong while preserving their average: that is what validate_scales replays this run's 10000 events for, field by field" }
samples = { tier = "banked", mode = "info", note = "the event side of the canonical leading-order QCD row, generated through the shipped binary and compared by distribution -- never by bytes, since this run's five subprocess groups make MadGraph's own unweighting draw scheduling-sensitive and a re-run of the same card yields a different, equally valid sample. Measured over three seeds of 20000 events against the banked 10000: every kinematic observable clears the 1e-4 floor (worst KS p 7.9e-2 on phi(j1)), SPINUP clears it (p 0.18 to 0.35), and the flavour frequencies clear it (chi-squared about 80 over 64 dof, p 0.08 to 0.16 over 65 to 71 compared assignments). ONE column fails, on every seed: ICOLUP, chi-squared about 2470 over 25 dof at p 0. Informational for that column alone, and the cause is localised rather than inferred -- it is NOT the subprocess mixture. The events this row emits for a flavour assignment containing an antiquark carry that leg's colour line in ICOLUP(1) where the Les Houches convention puts an antiquark's in ICOLUP(2): 2309 of 20000 events, 4758 of 80000 legs, every one of them an antiquark and always both antiquark legs of the same event. That is a statement about the record with no reference in it, and it is why those events land in a colour partition MadGraph never emits. Attribution: SubprocessRecord::relabelled carries a flavour group's colour flows from the group representative to every member on the premise that legs sharing an amplitude and a mass list share a record -- but u and u~ share both and carry conjugate SU(3) reps, so their ICOLUP slots must be swapped and are not. p p > j j is the first row whose groups mix them (g q > g q and g q~ > g q~ share a pointwise |M|^2, mass list, cut filter and colour basis); the gated samples rows do not, measured -- p p > l+ l- j 0 of 100000 legs and p p > b b~ 0 of 80000. Blind to: correlations between columns, a discrepancy confined to a small tail, and the ordering of the outgoing legs within an assignment, since canonical() sorts them by class label and then by pT" }

[[process]]
key = "pp_to_ll_scalefact2"
process = "p p > l+ l-"
script = "validation/madgraph/scripts/pp_to_ll_scalefact2.mg5"
class = "multi-channel"
n_final = 2
rationale = "The only banked run whose scalefact is not 1.0, and the only thing in the set that can say how many powers of it each scale carries: every other run leaves the factor at 1, where a prescription that squared it into the second beam's mu_F and one that applied it once are the same number. Same generate line, beams and shipped defaults as pp_to_ll with scalefact alone at 2.0, so the per-event SCALUP / <rscale> / <pdfrwt> are read against that row directly. Measured on its events: mu_F(beam 2) equals mu_F(beam 1) bit for bit in all 10000, which is the reading a doubled power would have made differ by exactly a factor of two."
artifacts = ["output/pp_to_ll_scalefact2", "output/pp_to_ll_scalefact2/Events/run_01/unweighted_events.lhe.gz"]
[process.categories]
diagrams = { tier = "covered-by", rows = ["pp_to_ll"] }
amplitudes = { tier = "covered-by", rows = ["uux_to_mumu"] }
integrals = { tier = "blocked", blocker = "mg-internal-pdf", note = "a cross section is not what this run is for -- the scale fields are, and validate_scales now reads all three of them out of the general clustering with the run card's scalefact 2.0 carried through. Its beams take pdlabel = nn23lo1, MadGraph's internal parameterisation rather than an LHAPDF6 grid, so the luminosity a cross section would be built from is not the one MadGraph used" }
samples = { tier = "blocked", blocker = "mg-internal-pdf", note = "generation runs through the same integrand as the cross section and meets the same parton densities" }

# ─────────────────────────── standalone gates ────────────────────────────────
#
# Process-independent checks, run once per invocation of their layer and
# reported as a list beside the per-process table rather than as cells in it.
#
# `targets` names the files a gate lives in, and a Rust gate needs nothing more:
# the banked task compiles the workspace and runs them all. A gate whose driver
# is not a Rust test carries two further keys — `task`, the pixi task that runs
# it, and `environment`, the pixi environment that task needs — and writes its
# verdict to `row`, under `target/validation-report/standalone/`.

[[standalone]]
key = "alphas-grid"
layer = "hermetic"
targets = ["vibegraph-lib/tests/alphas_reference_grid.rs"]
inputs = ["validation/alphas/reference.csv"]
rationale = "The running alpha_s against MadGraph's own alfas_functions.f, bit-for-bit: both sides run the same Newton iteration to the same tolerance, so agreeing on the iterate is stronger than agreeing on the root."

[[standalone]]
key = "alphas-events"
layer = "banked"
targets = ["vibegraph-lib/tests/validate_alphas.rs"]
inputs = ["banked LHE events (AQCDUP)", "MadGraph run logs"]
rationale = "AQCDUP replayed from the printed SCALUP for every event of every banked run, plus the asmz/nloop source rule against the run logs: a per-event oracle over 180k events rather than a single scalar."

[[standalone]]
key = "pdf-grid"
layer = "banked"
targets = ["vibegraph-lib/tests/validate_pdf_grid.rs"]
inputs = ["validation/pdf/oracle.json", "validation/pdf/oracle_multigrid.json"]
rationale = "The log-bicubic interpolation and the multi-subgrid walk against LHAPDF's own values — the library MadGraph evaluates PDFs through. The two sets differ in shape on purpose: one rectangular Q^2 subgrid, and two bands joined at a seam."
note = "The oracle dumps are committed; what keeps the gate in this layer is the other side of the comparison, the two fetched PDF sets."

[[standalone]]
key = "helas-kernels"
layer = "hermetic"
targets = ["vibegraph-lib/tests/helas_kernel_composition.rs"]
inputs = []
rationale = "The compiled evaluator against a hand-composed chain of this crate's own HELAS kernels over a dense (sqrt(s), cos theta) grid: independent of MadGraph, so it separates a compiler/rooting error from a kernel error."

[[standalone]]
key = "helas-fortran"
layer = "hermetic"
targets = ["vibegraph-lib/tests/validate_helas.rs"]
inputs = ["validation/helas/reference.csv"]
rationale = "The same chain against the original Fortran77 HELAS routines compiled through f2py — the ancestor library, not MadGraph's generated code. The grid is committed, so only its regeneration needs gfortran and f2py."

[[standalone]]
key = "rambo-fixture"
layer = "hermetic"
targets = ["vibegraph-lib/tests/rambo_oracle.rs"]
inputs = ["validation/rambo/rambo_fixture.json"]
rationale = "Momenta and weights replayed against a committed fixture dumped from the reference RAMBO implementation, so the weight's R_n and (2pi)^(4-3n) factors are pinned without a Monte-Carlo run."

[[standalone]]
key = "rambo-flat-mc"
layer = "banked"
targets = ["vibegraph-lib/tests/rambo_flat_mc.rs"]
inputs = []
rationale = "The RAMBO weight normalisation through a flat Monte-Carlo cross section against the QED analytic sigma: banked for cost, not for dependencies."

[[standalone]]
key = "runcard-defaults"
layer = "hermetic"
targets = ["vibegraph-lib/src/runcard.rs (unit tests)"]
inputs = ["validation/madgraph/runcard_defaults.json"]
rationale = "Every run-card default this crate transcribes, against a dump of MadGraph's own RunCardLO defaults: a transcription table is exactly the kind of thing that rots silently."

[[standalone]]
key = "color-cf"
layer = "banked"
targets = ["vibegraph-lib/tests/color_cf_oracle.rs"]
inputs = ["MadGraph-generated matrix1_orig.f DATA CF blocks"]
rationale = "The colour-factor matrix and NCOLOR against every generated matrix element's DATA CF block. Reads MadGraph Fortran sources rather than events, so it stays a standalone gate."

[[standalone]]
key = "color-flow-tags"
layer = "banked"
targets = ["vibegraph-lib/tests/color_flow_tags_oracle.rs"]
inputs = ["leshouche.inc per subprocess"]
rationale = "Each flow's Les Houches ICOLUP connectivity against leshouche.inc — the colour information an event file carries, which |M|^2 is blind to."

[[standalone]]
key = "lhef-roundtrip"
layer = "banked"
targets = ["vibegraph-lib/tests/validate_lhef.rs"]
inputs = ["banked .lhe.gz runs"]
rationale = "MadGraph's own banked events re-serialised byte-for-byte through our record types (the format oracle), the mutation checks that make that round-trip evidence, and a generated sample written and read back."

[[standalone]]
key = "scales-replay"
layer = "banked"
targets = ["vibegraph-lib/tests/validate_scales.rs"]
inputs = ["banked LHE events (SCALUP, <rscale>, <pdfrwt>)"]
rationale = "The renormalisation and factorisation scales replayed per event against three fields at two precisions, each event judged against a bound built from the printed precision of the momenta that formed it rather than a chosen tolerance."

[[standalone]]
key = "scale-couplings"
layer = "banked"
targets = ["vibegraph-lib/tests/validate_scale_couplings.rs"]
inputs = ["MadGraph process directories"]
rationale = "The constant-pool scaling path against a full model re-evaluation, entry by entry at 100 random alpha_s values, for every amplitude-gate process."

[[standalone]]
key = "sm-interned-blob"
layer = "banked"
targets = ["vibegraph-lib/tests/sm_interned_blob.rs"]
inputs = ["research/refs/mg5amcnlo submodule"]
rationale = "The committed interned SM model against a fresh parse of the pinned submodule, field by field plus every restrict card byte-for-byte. The committed blob is the hermetic truth; this is what catches it going stale after a submodule bump."

[[standalone]]
key = "ufo-models"
layer = "banked"
targets = ["vibegraph-lib/tests/ufo.rs"]
inputs = ["research/refs/mg5amcnlo submodule"]
rationale = "Loading UFO models the interned SM blob cannot stand in for (loop_sm, MSSM_SLHA2, the SM source tree itself), which is the only check that the parser handles a model it was not tuned on."

[[standalone]]
key = "diagram-counts"
layer = "hermetic"
targets = ["vibegraph-lib/tests/validate_madgraph_diagrams.rs"]
inputs = ["validation/madgraph/diagrams.json", "validation/madgraph/scripts/*.mg5"]
rationale = "Per-process diagram counts against MadGraph's own enumeration. Everything it reads is committed and the whole set — the two 2 -> 6 rows included — enumerates in 1.5 s, so the column runs on a bare clone."

[[standalone]]
key = "amplitudes-mg"
layer = "hermetic"
targets = ["vibegraph-lib/tests/amplitude_oracle.rs"]
inputs = ["validation/madgraph/amplitudes/<process>.json"]
rationale = "The gate behind the `amplitudes` column, one trial per row: |M|^2 at every banked point, and per-diagram AMP() plus per-flow JAMP() per helicity at a few of each point set. Listed here as well as in the table because a single binary covers every row."

[[standalone]]
key = "samples-mg"
layer = "banked"
targets = ["vibegraph-lib/tests/validate_samples.rs", "vibegraph-cli/tests/validate_samples_proton.rs"]
inputs = ["banked .lhe.gz runs", "fetched PDF set (proton rows)"]
rationale = "The gate behind the `samples` column: two binaries covering every row, one per beam kind. Listed here as well as in the table because they also carry two checks that belong to no row — a mutation probe comparing one process's banked events against another's, which must fail the same floor the rows pass (a statistic that never rejects would leave every green cell meaningless), and the measured refusal of the four dynamical-scale parton rows."

[[standalone]]
key = "hadronic-sigma"
layer = "banked"
targets = ["vibegraph-lib/tests/validate_hadronic.rs"]
inputs = ["fetched PDF set", "hadronic_sigma_reference.json", "output/pp_to_llj_fixed"]
rationale = "The hadronic cross sections, assembled from the PDF luminosity, the amplitude, the run-card cuts and VEGAS, driven by the same cards and PDF set MadGraph was given. Reported per process in the `integrals` column."

[[standalone]]
key = "cli-integrate"
layer = "banked"
targets = ["vibegraph-cli/tests/cli_integrate.rs"]
inputs = ["fetched PDF set", "hadronic_sigma_reference.json"]
rationale = "The shipped binary reproducing the library's banked cross sections from cards alone, which is the only check that the CLI's card handling and the library path agree."

[[standalone]]
key = "cli-generate-proton"
layer = "banked"
targets = ["vibegraph-cli/tests/cli_generate_proton.rs"]
inputs = ["fetched PDF set", "output/pp_to_llj_fixed"]
rationale = "Cards to an unweighted .lhe at proton beams, with every event's flavour assignment and colour connectivity checked against MadGraph's leshouche.inc and its own event sample."

[[standalone]]
key = "cli-pdf-cache-fetched"
layer = "banked"
targets = ["vibegraph-cli/tests/cli_pdf_cache_fetched.rs"]
inputs = ["fetched PDF set"]
rationale = "The cache and --pdf-dir resolution routes exercised with a real PDF set, from a working directory where no dev fallback can resolve. The refusal paths need no set and stay hermetic."

[[standalone]]
key = "vegas-sigma"
layer = "banked"
targets = ["vibegraph-lib/tests/validate_vegas.rs"]
inputs = []
rationale = "sigma(e+e- -> mu+mu-) through the evaluator and VEGAS against both the QED analytic formula and the banked MadGraph value: banked for cost (about 10^5 integrand evaluations), not for dependencies."

[[standalone]]
key = "rooting-soundness"
layer = "hermetic"
targets = ["vibegraph-lib/src/helas/eval/rooting_soundness.rs"]
inputs = ["validation/madgraph/amplitudes/<process>.json"]
rationale = "Re-rooting every diagram and requiring |M|^2 to be invariant. The oracle is the production rooting's own value, which is itself pinned against MadGraph, so any rooting that reproduces it is correct. It evaluates at the committed amplitude tables' points; the full sweep stays oracle-layer for cost (marked `#[ignore]`), and the fast transparency guard on the override hook runs by default."

[[standalone]]
key = "pythia-consumption"
layer = "banked"
task = "validate-pythia"
environment = "pythia"
row = "pythia_consumption.json"
targets = ["validation/pythia/generate_samples.sh", "validation/pythia/consume.py"]
inputs = ["fetched PDF set", "output/pp_to_llj_fixed/Cards/run_card.dat", "dy13_proc_card.dat", "dy13_default_run_card.dat"]
rationale = "Every event of two freshly generated samples read back through Pythia 8. The only gate whose oracle is a downstream consumer rather than MadGraph, and the only place the colour lines we write are used as input rather than compared as data. Metric: n/n events consumed at the process level, where a refusal is about the file; shower-level failures are reported apart and never gate."
note = "It generates its own samples rather than reading a banked one, so it needs the cards but not MadGraph. A negative control — one event rewritten with a dangling colour index, which Pythia must reject and its neighbours must survive — keeps n/n from being consistent with a reader that ignores colour. Its own environment, so `pixi run validate` does not need Pythia installed."

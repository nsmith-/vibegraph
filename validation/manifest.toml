[[process]]
key = "uux_to_mumu"
process = "u u~ > mu+ mu-"
script = "validation/madgraph/scripts/uux_to_mumu.mg5"
class = "single-channel"
n_final = 2
rationale = "Partonic Drell-Yan: a coloured initial state with an alpha_s-free matrix element, so the initial-state colour average (1/9) and the N_c sum are exercised at fixed coupling. Partonic beams at 250+250 GeV keep the s-channel propagator off the Z pole."
artifacts = ["output/uux_to_mumu", "sigma_reference.json#uux_to_mumu", "amplitudes/uux_to_mumu.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate", note = "its own table: the event points are this run's partonic-beam events, the fixed grid is shared with pp_to_ll_qcd0, whose matrix element is the same concrete subprocess compiled from another process directory" }
integrals = { tier = "banked", mode = "gate" }
samples = { tier = "banked", mode = "gate" }

[[process]]
key = "uux_to_uux"
process = "u u~ > u u~"
script = "validation/madgraph/scripts/uux_to_uux.mg5"
class = "single-channel"
n_final = 2
rationale = "Identical-flavour quark lines: s- and t-channel gluon exchange give a genuine NCOLOR=2 amplitude, the smallest real test of the multi-flow CF matrix (CF = [[9,3],[3,9]]) and of the T.T Fierz half of the colour vocabulary."
artifacts = ["output/uux_to_uux", "output/uux_to_uux_amplitude.csv", "sigma_reference.json#uux_to_uux", "amplitudes/uux_to_uux.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate", note = "carries a standing -0.30% bias against the banked sigma; resolution is the multi-rung spine feature, and the cell stays visible until then" }
samples = { tier = "banked", mode = "gate", note = "the colour-selection row: MadGraph writes the flow whose lines join each incoming pair on 99.96% of its events, and so do we — 99.960% against 99.960%, chi-squared 0.0 on one degree of freedom, from 1015 before the rule was implemented. What changed is the conditioning, not the JAMP2 weights: the configuration is drawn per event proportional to each diagram's own AMP2 (the evaluator accumulates it on the same compiled program, gated against MadGraph's own AMP2 array by `amplitude_oracle`) and the flow then proportional to JAMP2 within that configuration's ICOLAMP-admitted set, which is MadEvent's SELECT_COLOR. Kinematics min KS p 6.5e-2 and helicity frequencies p 0.68 or better over three seeds" }

[[process]]
key = "gg_to_ttx"
process = "g g > t t~"
script = "validation/madgraph/scripts/gg_to_ttx.mg5"
class = "single-channel"
n_final = 2
rationale = "External octets feeding a quark line: the f(1,2,3) triple-gluon vertex resolved through the f -> trace colour rules, giving NCOLOR=2 with CF = [[16/3,-2/3],[-2/3,16/3]]. Complements uux_to_uux with the other half of the SM colour vocabulary."
artifacts = ["output/gg_to_ttx", "output/gg_to_ttx_amplitude.csv", "sigma_reference.json#gg_to_ttx", "amplitudes/gg_to_ttx.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate" }
samples = { tier = "banked", mode = "gate" }

[[process]]
key = "gg_to_gg"
process = "g g > g g"
script = "validation/madgraph/scripts/gg_to_gg.mg5"
class = "single-channel"
n_final = 2
rationale = "The four-gluon vertex — the only SM vertex with more than one colour structure — and pure-f colour algebra reduced to the six-element single-trace basis (NCOLOR=6). The stress test for per-chain rooting of multi-structure vertices and the largest CF contraction in the tree-level vocabulary."
artifacts = ["output/gg_to_gg", "output/gg_to_gg_amplitude.csv", "sigma_reference.json#gg_to_gg", "amplitudes/gg_to_gg.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "info", note = "6 against 4: MadGraph writes the four-gluon contact term as one graph per colour structure (VVVV1_0/VVVV3_0/VVVV4_0 into AMP(1..3)) where we write one diagram whose vertex carries all three, so 3 + 3 against 3 + 1. Reported, not enforced — the amplitudes cell pins the same process at a finer level than a count." }
amplitudes = { tier = "hermetic", mode = "gate", factorized = false, note = "the full per-helicity x per-flow outer product agrees under the identity flow pairing, so the factorized comparison the six-flow basis was allowed is not needed. What the basis does cost is a pairing ambiguity: trace-reversed flows carry identical JAMPs, so swapping such a pair is invisible here and is pinned by color-flow-tags instead" }
integrals = { tier = "banked", mode = "gate" }
samples = { tier = "banked", mode = "gate" }

[[process]]
key = "ee_to_mumua"
process = "e+ e- > mu+ mu- a"
script = "validation/madgraph/scripts/ee_to_mumua.mg5"
class = "single-channel"
n_final = 3
rationale = "First external vector wavefunction (vxxxxx) compared against MadGraph; a massless photon has exactly two physical helicity states, so the state list itself is under test."
artifacts = ["output/ee_to_mumua", "output/ee_to_mumua.json", "output/ee_to_mumua_amplitude.csv", "sigma_reference.json#ee_to_mumua", "amplitudes/ee_to_mumua.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate", note = "run-card photon pT/isolation cuts regulate the soft and collinear divergences. The +0.8% standing offset against the bank was measured to five windows in pt(a) with edges 10, 20, 39.4 (the radiative-return threshold p_RR/cosh(etaa)), 77, 144, 250 GeV, both sides windowed two ways: the reference owns it. MadGraph's own dummy_cuts partition sums to 1.001221e-1 +- 2.2e-5 pb against its own unwindowed 9.998860e-2 +- 3.8e-5 pb over five fresh seeds at nevents=100000, +0.133%, 3.07 sigma on its own quoted errors -- the second occurrence of ee_to_mumu_tata_qcd0's shape, at 17x smaller size and by a different mechanism (get_channel_cut is identically 1 here: sde_strategy=1 with tmin_for_channel=-1 in both MadGraph lines, so the 3.5.7 defect is unreachable). This side's five independent per-window re-surveys close at -0.168% +- 0.110%, -1.53 sigma, and its total is seed-consistent (chi2/dof 0.69 over five seeds) and budget-stable (+0.177% under 4x against a 0.232% bound). The version story is refuted rather than confirmed: MadGraph 3.5.7 and 3.7.1 give 1.000624e-1 and 9.998860e-2 over five seeds each, +0.074% apart and 1.20 combined-seed-spread sigma, and 3.7.1's quoted error covers its own spread at both budgets (cloud chi2/dof 0.90 at 100k, 0.32 at the bank's 10k). rel_tol 0.03 is unchanged and was not widened. Unsettled and tracked separately: a localised +1.22% (6.1 sigma) and +0.87% (5.4 sigma) excess of this side over MadGraph in [39.4, 77) and [77, 144), chi2_flat 27.75 on 4 dof. Re-surveyed MadGraph confirms its own windowed value there rather than moving to ours -- imposing [39.4, 77) as run-card pta/ptamax, so the generator adapts to the window instead of having it applied after the fact, gives 2.759167e-2 pb over three seeds, 1.71 sigma from the dummy_cuts value on seed-spread errors and 4.67 sigma from this side's, closing only 22% of the gap. Window-blind sampling at the radiative-return turn-on is therefore excluded as the explanation, and the ~0.9-1.2% excess is a stable integrand-level disagreement with this side high: unattributed, tracked, and not a demotion" }
samples = { tier = "banked", mode = "gate", note = "the pt(a) KS cell sits closest to the p-floor of any gating row (2.74e-4), and the windowed measurement says the banked sample is the object that is wrong. All MadGraph events carry one identical XWGTUP, so the sample's pt(a) fractions estimate the same cross-section shares its windowed runs measure -- and they disagree, internally to MadGraph: over five fresh 100k-event runs the unwindowed sample puts 8.732% +- 0.033% of sigma in pt(a) in [10, 20) where MadGraph's own dummy_cuts cross section for that window puts 9.395%, a 0.66 pp / 19.9 sigma gap that reproduces on both MadGraph lines (3.5.7 samples give 8.805% and 8.655%). This side's two independent estimators land on the windowed number, not the sample: 9.378% from the per-window re-survey and 9.402% from the gate-configuration draws, while the two sides' integrals of that window agree to +0.20% +- 0.24%. The sample moves about 0.9 pp out of the two lowest pt(a) windows into the three radiative-return ones. The p-floor is unchanged" }

[[process]]
key = "ee_to_tatah"
process = "e+ e- > ta+ ta- h"
script = "validation/madgraph/scripts/ee_to_tatah.mg5"
class = "single-channel"
n_final = 3
rationale = "External FFS Yukawa emission: the Higgs radiated off a massive tau line, so an external scalar meets the fermion chain — untested by the VVS-only zh channel."
artifacts = ["output/ee_to_tatah", "output/ee_to_tatah.json", "output/ee_to_tatah_amplitude.csv", "sigma_reference.json#ee_to_tatah", "amplitudes/ee_to_tatah.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate" }
samples = { tier = "banked", mode = "gate" }

[[process]]
key = "uux_to_epemg"
process = "u u~ > e+ e- g QCD=2 QED=2"
script = "validation/madgraph/scripts/uux_to_epemg.mg5"
class = "single-channel"
n_final = 3
rationale = "Baseline of a three-point design over the llj subprocess classes (this row, gu_to_epemu varying the colour arrangement, ddx_to_epemg varying the initial flavour). A gluon radiated off an annihilating quark line, single colour structure T^a_{ij}; the two attachments differ by the sign of the internal quark propagator's momentum, where a fermion-flow error shows up per diagram while |M|^2 stays unmoved."
artifacts = ["output/uux_to_epemg", "output/uux_to_epemg_amplitude.csv", "sigma_reference.json#uux_to_epemg", "amplitudes/uux_to_epemg.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate", note = "the first enforced cross section whose renormalisation scale is recomputed from each point's own kT clustering, so sigma is linear in a coupling that moves under the sampler. Over five seeds at 60000 x 8 and at four times that (probe_llj_parton_seed_stability) |rel| <= 3.9e-3 with mean +2.8e-3, and the mean is flat across the ladder (+2.8e-3 -> +2.3e-3), so what is left is inside twice the banked run's own 0.21% Monte-Carlo error rather than a convergence residual. rel_tol 0.01 is that spread with headroom, not the reference's error. No banked event of this run needs an integration channel other than the first, which is what separates it from gu_to_epemu and gux_to_epemux below" }
samples = { tier = "banked", mode = "gate", note = "the same per-event cluster scale seen in the unweighted sample: the accept/reject draw runs over an integrand whose coupling moves with the point, where every other fixed-beam samples row draws on a constant one. Min KS p 3.7e-2 (phi(e+)) and min SPINUP chi-squared p 0.48 on 7 degrees of freedom, over three seeds. the_llj_parton_rows_take_a_per_event_cluster_scale asserts the prescription did not collapse to a constant, which is how this could agree without measuring the clustering at all" }

[[process]]
key = "ddx_to_epemg"
process = "d d~ > e+ e- g QCD=2 QED=2"
script = "validation/madgraph/scripts/ddx_to_epemg.mg5"
class = "single-channel"
n_final = 3
rationale = "The down-type partner of uux_to_epemg: identical topology and colour structure, different electroweak couplings. Holding everything but the initial flavour fixed makes a coupling-table error separable from a topology or flow-convention error."
artifacts = ["output/ddx_to_epemg", "output/ddx_to_epemg_amplitude.csv", "sigma_reference.json#ddx_to_epemg", "amplitudes/ddx_to_epemg.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate", note = "the down-type partner of uux_to_epemg at the same kT-clustered per-event scale, and the wider of the two: over five seeds at 60000 x 8 and at four times that (probe_llj_parton_seed_stability) |rel| <= 5.6e-3 with means +4.3e-3 and +4.4e-3, so budget-flat and about 2.1 of the banked run's own 0.20% Monte-Carlo error, which is the term the pull is dominated by and which no budget on this side can shrink. rel_tol 0.01 is that spread with headroom. Like uux_to_epemg, no banked event of this run needs an integration channel other than the first" }
samples = { tier = "banked", mode = "gate", note = "the same per-event cluster scale seen in the unweighted sample, at a different initial flavour: holding the topology and the colour structure fixed and moving only the electroweak couplings is what makes a coupling-table error separable here from a scale one. Min KS p 5.8e-3 (m(e-,g)) and min SPINUP chi-squared p 0.87, over three seeds" }

[[process]]
key = "gu_to_epemu"
process = "g u > e+ e- u QCD=2 QED=2"
script = "validation/madgraph/scripts/gu_to_epemu.mg5"
class = "single-channel"
n_final = 3
rationale = "The first mixed incoming colour arrangement: one adjoint beam and one fundamental beam, with the quark line running through a spacelike propagator. Also the crossing of uux_to_epemg, so a convention error that is a property of the arrangement rather than of the functions shows up here and not there."
artifacts = ["output/gu_to_epemu", "output/gu_to_epemu_amplitude.csv", "sigma_reference.json#gu_to_epemu", "amplitudes/gu_to_epemu.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate", note = "the row the sampled integration channel had to reach before it could be enforced: 7204 of this run's 10000 banked events cluster in a channel other than the first, so while the prescription read channel 1 on every point sigma was 5.5% low, and reading it in the channel the multichannel drew leaves mean rel +1.07e-2 over five seeds at 60000 x 8 (worst 1.16e-2) and +1.13e-2 at four times it (worst 1.20e-2). Budget-flat, so what remains is a bias and not sampling -- and it is the channel PARTITION, measured rather than assumed. Once the scale reads the integration channel, sigma stops being independent of the multichannel selection weights: alpha_j decides which scale a region of phase space is evaluated at, not only how often it is visited. probe_channel_partition_moves_sigma integrates the same row at the converged alpha and at uniform alpha and finds -1.48e-2 between them against a Monte-Carlo error of 1.6e-3 (9 sigma), while the same probe moves uux_to_epemg and ddx_to_epemg by +1.0e-3 and +1.9e-3 -- their own noise, because no channel moves their scale. That is the negative control. MadGraph's own sigma lies INSIDE the interval our two partitions span (+1.08e-2 at the converged alpha, -4.2e-3 at uniform), and MadEvent partitions by a third rule again: single-diagram enhancement weights channel c by AMP2_c/sum AMP2. rel_tol 0.02 is therefore the scale of that ambiguity with headroom over the worst measured 1.20e-2, not the reference's 0.18% error and not a bound fitted to one number. The pull (+5.21) is reported and NOT asserted on this row and on gux_to_epemux, and on no other: a pull is the right statistic when the residual is Monte Carlo, and the wrong one when it is a systematic of measured size, because then it grows without bound as this side's error falls while the disagreement stays put. rel, the five-seed sweep and chi2/dof are the criteria. The amplitudes are gated at 4.07e-14 on the same process, so nothing upstream of the scale is in question" }
samples = { tier = "banked", mode = "gate", note = "the accept/reject draw runs over an integrand whose coupling moves with the point AND with the channel the point was drawn in, which is what makes this row's sample different from every other fixed-beam one. Min KS p 1.3e-2 (cs_cos(ll)) and min SPINUP chi-squared p 2.9e-2 on 7 degrees of freedom, over three seeds, against a 1e-4 floor. It moved with the plumbing (it read 2.0e-2 and 8.0e-2 while the scale was taken in channel 1) because the weights the trials are accepted on moved. Its blind spot, stated rather than left to be noticed: these are weighted-ECDF and homogeneity statistics on SHAPES, so a scale wrong by a nearly uniform factor over the fiducial region moves sigma without moving a shape. This cell could not see the 5.5% deficit the integrals cell used to record, and it cannot see the residual channel-partition ambiguity that cell records now. The sigma cell is where both live" }


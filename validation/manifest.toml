[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate", note = "the first enforced cross section whose renormalisation scale is recomputed from each point's own kT clustering, so sigma is linear in a coupling that moves under the sampler. Over five seeds at 60000 x 8 and at four times that (probe_llj_parton_seed_stability) |rel| <= 3.9e-3 with mean +2.8e-3, and the mean is flat across the ladder (+2.8e-3 -> +2.3e-3), so what is left is inside twice the banked run's own 0.21% Monte-Carlo error rather than a convergence residual. rel_tol 0.01 is that spread with headroom, not the reference's error. No banked event of this run needs an integration channel other than the first, which is what separates it from gu_to_epemu and gux_to_epemux below" }
samples = { tier = "banked", mode = "gate", note = "the same per-event cluster scale seen in the unweighted sample: the accept/reject draw runs over an integrand whose coupling moves with the point, where every other fixed-beam samples row draws on a constant one. Min KS p 3.7e-2 (phi(e+)) and min SPINUP chi-squared p 0.48 on 7 degrees of freedom, over three seeds. the_llj_parton_rows_take_a_per_event_cluster_scale asserts the prescription did not collapse to a constant, which is how this could agree without measuring the clustering at all" }


# ──────────────────────── the SMEFTsim ladder ────────────────────────────────
#
# Rows generated against a vendored UFO model rather than the interned Standard
# Model: SMEFTsim 3.0's `topU3l_MwScheme`, under one restrict card per class of
# Wilson coefficient. `model` is the repository-relative UFO directory and
# `restrict` the card's name, so `import model <model>-<restrict>` in the row's
# .mg5 script and the loader call the gates make are the same statement. The
# cards the model ships (`SMlimit_massless`, `massless`) sit inside it; the
# per-class ones this repository authors sit in
# `validation/madgraph/cards/smeft/` and are staged into the model copy
# `validation/madgraph/build.sh` puts in the work area, so both generators
# prune from the same file.
#
# The cells were registered informational and red before the code that would turn
# them green existed, which is what makes the day one lands an end-to-end signal
# rather than a claim. A row is promoted to `gate` when its comparison agrees at
# the amplitude gate's own standard, one row at a time; what a row's rationale
# records is the Lorentz or colour structure it is the *only* row to reach, so a
# cell that stays informational names exactly what is still missing.

[[process]]
key = "ee_to_mumu_smlimit"
process = "e+ e- > mu+ mu-"
model = "validation/ufo/SMEFTsim_topU3l_MwScheme_UFO"
restrict = "SMlimit_massless"
script = "validation/madgraph/scripts/ee_to_mumu_smlimit.mg5"
class = "single-channel"
n_final = 2
bundled = false
rationale = "The SMEFTsim SM limit on the smallest amplitude there is. Every Wilson coefficient is zero under restrict_SMlimit_massless, so MadGraph's matrix element is the Standard Model's and the interned-SM row of the same process already gates the physics -- what this row isolates is the model plumbing around it: a UFO read from source, the {mW, mZ, GF} input scheme, MadGraph's splitting of one vertex into one interaction per coupling-order tuple, and the pruning of the couplings the card zeroes."
artifacts = ["output/ee_to_mumu_smlimit", "output/ee_to_mumu_smlimit.json", "output/ee_to_mumu_smlimit_amplitude.csv", "amplitudes/ee_to_mumu_smlimit.json"]
mg_amplitude = { process = "e+ e- > mu+ mu-", pdgs_in = [-11, 11], pdgs_out = [-13, 13], sqrt_s_list = [200.0, 500.0], npoints = 12, seed = 101 }
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "covered-by", rows = ["ee_to_mumu"], note = "the same matrix element, gated as a cross section on the interned-SM row of this process" }
samples = { tier = "uncovered", note = "no SMEFTsim event sample is banked. What a samples cell measures -- unweighting, colour and helicity selection, the LHE writer -- is model-independent and gated on the Standard-Model rows; what it would add here is the shape of a SMEFT matrix element under the same machinery, which is worth banking once a SMEFT cross section is gated and not before" }


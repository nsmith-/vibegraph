samples = { tier = "banked", mode = "gate", note = "generated_llj_dyn_events_agree_with_madgraphs_banked_ones (validate_samples_proton.rs): the same integrate-then-generate path as pp_to_llj_fixed, on this run's own dynamical-scale card, 20000 events per seed against MadGraph's banked 10000. Every column clears the 1e-4 p-value floor on all three seeds -- worst KS m(l+,l-) p 1.496e-2 (D 0.0192), worst chi2 ICOLUP p 3.691e-1 (chi2 2.7/5 dof) -- so this is the first sample-level exercise of the per-point AMP2-drawn configuration: the SPINUP, ICOLUP and flavour-group columns all pass under the draw, not merely the integrated cross section" }


amplitudes = { tier = "hermetic", mode = "gate", note = "35 diagrams, NCOLOR = 2, over 74 points, 6 of them carrying MadGraph's AMP() and JAMP() for every one of the 8 helicity combinations its amplitude does not vanish on. |M|^2 max rel 4.2e-14 on the grid and 2.6e-14 on the events, per-flow 3.0e-15, JAMP2 2.6e-14, and every one of the 35 diagrams against MadGraph's bare AMP() at 6.6e-15 under a single global phase (G = -i). This is the row that exposed the mixed-line arm of the fermion-line spine sign: it is the first banked process with two mixed (initial<->final) fermion lines, so its one internal fermion propagator sits on a mixed line in 24 diagrams and on the crossed lepton line in 9, and the two arms had to be told apart. Listed in KNOWN_CONFIG_MERGE -- MadGraph writes 21 AMP2 accumulators over the 35 diagrams -- so the AMP2 comparison is skipped and the amplitudes are paired one by one through the diagram behind each of our configurations rather than through MadGraph's grouping, which does not list graphs in graph order once it merges" }
integrals = { tier = "banked", mode = "gate", note = "sigma = 1.409864e-2 +- 1.841e-5 pb against MadGraph's 1.410700e-2 +- 3.4241e-5 pb: pull -0.22, rel -0.06%, chi2/dof 1.20 at 120000 x 8. Enforced at rel_tol 0.01, set by the seed spread rather than by the reference error -- over five seeds |pull| <= 0.96 and |rel| <= 2.6e-3 with chi2/dof in 1.00-1.39, and quadrupling the budget scatters rel -5.9e-4 / +1.3e-4 / -1.3e-3 inside the band the reference's own 0.24% error sets. The phase-space side carries this number alone: all 35 channels are peripheral rung chains, so the cross section is drawn entirely through the ordered chain with no all-timelike member to fall back on" }
samples = { tier = "banked", mode = "info", note = "20000 events over 3 seeds (60000 x 6 budget, no seed short of the 20000 target). Kinematics and SPINUP agree -- min KS p 1.015e-1, SPINUP chi2 p 0.43-0.73 -- but ICOLUP does not: chi2 642.2/646.5/664.3 on 1 dof (p ~ 0) on every seed, a sharp and seed-stable colour-connectivity disagreement rather than a marginal miss. Informational rather than gated; the ICOLUP disagreement is filed as a follow-up rather than tuned away" }

# ──────────────────────────── multi-channel rows ─────────────────────────────
#
# Proton beams and multiparticle labels, so one row is a group of concrete
# subprocesses. The `diagrams` cell matches the per-flavour union against
# MadGraph's; `amplitudes` is generally covered by the single-channel rows that
# are the group's concrete subprocesses, stated here rather than left implicit.

[[process]]
key = "pp_to_ll"
process = "p p > l+ l-"
script = "validation/madgraph/scripts/pp_to_ll.mg5"
class = "multi-channel"
n_final = 2
rationale = "Drell-Yan at default coupling orders: the flavour-group path over a proton beam, and — through the two committed dy13 run cards (default cuts, and the m_ll in [60,120] window) — the hadronic cross-section reference that pins the PDF luminosity, the flux and the cuts together."
artifacts = ["output/pp_to_ll", "output/pp_to_ll.json", "output/dy13_default", "output/dy13_mmll_60_120", "hadronic_sigma_reference.json", "dy13_default_run_card.dat", "dy13_mmll_run_card.dat", "dy13_proc_card.dat", "dy13_param_card.dat"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate", note = "includes the per-flavour concrete-subprocess union, not only the count" }
amplitudes = { tier = "covered-by", rows = ["uux_to_mumu"] }
integrals = { tier = "banked", mode = "gate", note = "two cards, both through the general proton path; no bespoke integrand. Three seeds each: pull +0.25 (rel +0.02%) on the default card, -1.35 (rel -0.10%) on the m_ll window" }
samples = { tier = "banked", mode = "gate", note = "the two dy13 cards' own runs, which bank their events and their cross section out of one MadGraph invocation, so what this compares against and what the integrals cell gates on cannot drift apart. 200000 MadGraph events per card against 3 x 20000 of ours: minimum KS p 2.2e-2 (y(l-)) and 2.6e-2 (phi(l+)/pi), minimum chi-squared p 2.9e-3 on SPINUP for one seed of the default card against 0.49 and 0.72 on the other two, so not seed-stable. pt(ll) is a constant of the process at this order and is named rather than compared. The row also carries the differential normalisation those p-values are blind to: dsigma/dm_ll in absolute picobarns from the 20 GeV threshold the pt cut implies out to 1 TeV, every judged bin within 2.3 combined errors and no weight below the threshold on either side" }

[[process]]
key = "pp_to_ll_qcd0"
process = "p p > l+ l- QCD=0"
script = "validation/madgraph/scripts/pp_to_ll_qcd0.mg5"
class = "multi-channel"
n_final = 2
rationale = "Drell-Yan with the strong coupling forbidden: the order-constraint counterpart of pp_to_ll, and the group whose banked amplitude table is the concrete u u~ > mu+ mu- subprocess every partonic Drell-Yan check reads."
artifacts = ["output/pp_to_ll_qcd0", "output/pp_to_ll_qcd0.json", "output/pp_to_ll_qcd0_amplitude.csv", "amplitudes/pp_to_ll_qcd0.json"]
# Generates through this row's own compiled module (the concrete u u~ > mu+ mu-
# subprocess), which is also uux_to_mumu's amplitude table — see that row's
# `amplitudes` note.
mg_amplitude = { process = "u u~ > mu+ mu-", pdgs_in = [2, -2], pdgs_out = [-13, 13], sqrt_s_list = [10.0, 50.0, 91.188, 200.0, 500.0], npoints = 10, seed = 5 }
[process.categories]
diagrams = { tier = "hermetic", mode = "gate", note = "includes the per-flavour concrete-subprocess union" }
amplitudes = { tier = "hermetic", mode = "gate", note = "its banked table is the u u~ > mu+ mu- subprocess; the event points are the group's proton-beam events filtered to that flavour assignment and boosted into the partonic centre of mass, so this is the one row whose points come from a hadronic run" }
integrals = { tier = "covered-by", rows = ["pp_to_ll"] }
samples = { tier = "covered-by", rows = ["pp_to_ll"], note = "the same pointer its integrals cell carries, and for the same reason: the two rows enumerate the same diagrams, so the order constraint changes what the selection is asked for and not what it returns. What a sample would add here is the order semantics, which the diagrams cell measures directly" }

[[process]]
key = "pp_to_bb"
process = "p p > b b~"
script = "validation/madgraph/scripts/pp_to_bb.mg5"
class = "multi-channel"
n_final = 2
rationale = "A pure-QCD group at default coupling orders: the flavour union spans both q q~ and g g initial states, which is diagram content no electroweak-core group reaches."
artifacts = ["output/pp_to_bb", "output/pp_to_bb.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate", note = "includes the per-flavour concrete-subprocess union" }
amplitudes = { tier = "uncovered", note = "no banked b b~ parton row exists; the single-channel colour rows (uux_to_uux, gg_to_ttx) cover the same colour structures at other flavours" }
integrals = { tier = "banked", mode = "gate", note = "the row that reaches the softest phase space of any enforced cross section: ptb = 0 and dsqrt_shat = 0 leave the b masses as the only floor, so setcuts.f's shat_min is (2 m_b)^2 = 88 GeV^2 against pp_to_bb_fixed's 1600, and sigma is four orders larger at 3.76e8 pb. sigma = 3.764363e8 +- 1.670e5 pb against MadGraph's 3.762400e8 +- 2.679e5: pull +0.62, rel +0.05%, chi2/dof 0.81 over three seeds at 75000 x 10. The budget ladder (probe_recarded_budget_ladder, five seeds a rung) reads +0.07% / -0.01% / +0.02% / -0.02% at 75k / 150k / 300k / 600k with chi2/dof 0.55 / 1.00 / 0.09 / 0.19 -- flat across an eightfold range and no rung whose seeds scatter by more than they claim, so the gate runs at the lowest rung the ladder resolves as converged and the seed sweep measures an agreement rather than this crate's convergence. rel_tol 0.005 is set from the reference's own 0.071% Monte-Carlo error with headroom, and the pull is asserted because MadGraph's error on this run is 1.6x this side's at the gate budget, so no budget spent here drives it up. That ratio is what the budget is set from: the gate resolves at sqrt(sigma_ours^2 + sigma_MG^2), so points bought past the reference's own precision are invisible to the comparison. Measurable at all only since the re-bank onto lhaid 247000: against the nn23lo1 run the two sides convolved different parton densities and the comparison read the 9.8% between them" }
samples = { tier = "banked", mode = "gate", note = "generated_bb_recarded_events_agree_with_madgraphs_banked_ones: the same integrate-then-generate path as pp_to_bb_fixed on this run's own uncut, dynamical-scale card. Every column clears the 1e-4 p-value floor on all three seeds -- min KS p 9.257e-2 (y(b)), min chi2 p 1.586e-1 (flavour) -- with no column to report" }


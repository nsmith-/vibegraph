[[process]]
key = "gg_to_gg"
process = "g g > g g"
script = "validation/madgraph/scripts/gg_to_gg.mg5"
class = "single-channel"
n_final = 2
rationale = "The four-gluon vertex — the only SM vertex with more than one colour structure — and pure-f colour algebra reduced to the six-element single-trace basis (NCOLOR=6). The stress test for per-chain rooting of multi-structure vertices and the largest CF contraction in the tree-level vocabulary."
artifacts = ["output/gg_to_gg", "output/gg_to_gg_amplitude.csv", "sigma_reference.json#gg_to_gg", "amplitudes/gg_to_gg.json"]
mg_amplitude = { process = "g g > g g", pdgs_in = [21, 21], pdgs_out = [21, 21], sqrt_s_list = [50.0, 200.0, 500.0], npoints = 25, seed = 47 }
[process.categories]
diagrams = { tier = "hermetic", mode = "info", note = "6 against 4: MadGraph writes the four-gluon contact term as one graph per colour structure (VVVV1_0/VVVV3_0/VVVV4_0 into AMP(1..3)) where we write one diagram whose vertex carries all three, so 3 + 3 against 3 + 1. Reported, not enforced — the amplitudes cell pins the same process at a finer level than a count." }
amplitudes = { tier = "hermetic", mode = "gate", factorized = false, note = "the full per-helicity x per-flow outer product agrees under the identity flow pairing, so the factorized comparison the six-flow basis was allowed is not needed. What the basis does cost is a pairing ambiguity: trace-reversed flows carry identical JAMPs, so swapping such a pair is invisible here and is pinned by color-flow-tags instead" }
integrals = { tier = "banked", mode = "gate" }
samples = { tier = "banked", mode = "gate" }

[[process]]

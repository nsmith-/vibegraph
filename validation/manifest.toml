rationale = "llj at default coupling orders. Kept alongside the explicit-order scripts (pp_to_llj_fixed, pp_to_llj_dyn, same generate line with QCD=2 QED=2) because the pair is what pins order-constraint semantics: the two spellings must select the same diagram content. Its banked run is the one whose per-event scales come out of the general clustering over three final-state legs at MadGraph's own dynamical default, replayed field by field in validate_scales."
artifacts = ["output/pp_to_llj", "output/pp_to_llj.json"]
[process.categories]
diagrams = { tier = "hermetic", mode = "gate", note = "includes the per-flavour union; the point of the row is the order-selection semantics" }

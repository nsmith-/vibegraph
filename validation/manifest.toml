artifacts = ["output/gg_to_ttx", "output/gg_to_ttx_amplitude.csv", "sigma_reference.json#gg_to_ttx", "amplitudes/gg_to_ttx.json"]
mg_amplitude = { process = "g g > t t~", pdgs_in = [21, 21], pdgs_out = [6, -6], sqrt_s_list = [400.0, 500.0], npoints = 25, seed = 43 }
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate" }
samples = { tier = "banked", mode = "gate" }

[[process]]
key = "gg_to_gg"
process = "g g > g g"
script = "validation/madgraph/scripts/gg_to_gg.mg5"
class = "single-channel"
n_final = 2
rationale = "The four-gluon vertex — the only SM vertex with more than one colour structure — and pure-f colour algebra reduced to the six-element single-trace basis (NCOLOR=6). The stress test for per-chain rooting of multi-structure vertices and the largest CF contraction in the tree-level vocabulary."
artifacts = ["output/gg_to_gg", "output/gg_to_gg_amplitude.csv", "sigma_reference.json#gg_to_gg", "amplitudes/gg_to_gg.json"]
mg_amplitude = { process = "g g > g g", pdgs_in = [21, 21], pdgs_out = [21, 21], sqrt_s_list = [50.0, 200.0, 500.0], npoints = 25, seed = 47 }
[process.categories]
diagrams = { tier = "hermetic", mode = "info", note = "6 against 4: MadGraph writes the four-gluon contact term as one graph per colour structure (VVVV1_0/VVVV3_0/VVVV4_0 into AMP(1..3)) where we write one diagram whose vertex carries all three, so 3 + 3 against 3 + 1. Reported, not enforced — the amplitudes cell pins the same process at a finer level than a count." }
amplitudes = { tier = "hermetic", mode = "gate", factorized = false, note = "the full per-helicity x per-flow outer product agrees under the identity flow pairing, so the factorized comparison the six-flow basis was allowed is not needed. What the basis does cost is a pairing ambiguity: trace-reversed flows carry identical JAMPs, so swapping such a pair is invisible here and is pinned by color-flow-tags instead" }
integrals = { tier = "banked", mode = "gate" }
samples = { tier = "banked", mode = "gate" }

[[process]]
key = "ee_to_mumua"
process = "e+ e- > mu+ mu- a"
script = "validation/madgraph/scripts/ee_to_mumua.mg5"
class = "single-channel"
n_final = 3
rationale = "First external vector wavefunction (vxxxxx) compared against MadGraph; a massless photon has exactly two physical helicity states, so the state list itself is under test."
artifacts = ["output/ee_to_mumua", "output/ee_to_mumua.json", "output/ee_to_mumua_amplitude.csv", "sigma_reference.json#ee_to_mumua", "amplitudes/ee_to_mumua.json"]
mg_amplitude = { process = "e+ e- > mu+ mu- a", pdgs_in = [-11, 11], pdgs_out = [-13, 13, 22], sqrt_s_list = [200.0, 500.0], npoints = 25, seed = 17 }
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate", note = "run-card photon pT/isolation cuts regulate the soft and collinear divergences. The standing offset against the bank is +1.04%, measured over five seeds at the gate budget at chi2/dof 0.50 -- a fixed offset the seeds resolve, not a spread they scatter over, and stable under the cut-implied timelike floors on the invariant draw, which move sigma by +0.006% and give +1.05% at chi2/dof 0.45. Its pull is therefore reported and not asserted (ee_to_mumua is in validate_sigma.rs's PULL_REPORTED_NOT_ASSERTED): a pull grows without bound as this side's error falls while a systematic stays where it is, and at five seeds this one reads +4.11 and +4.17 across those two sweeps. The single-seed gate reading of +2.83 is an accident of its own draw, that seed sitting 0.089% below its five-seed mean. rel_tol 0.03 remains enforced and is what bounds the offset's size. The offset was measured to five windows in pt(a) with edges 10, 20, 39.4 (the radiative-return threshold p_RR/cosh(etaa)), 77, 144, 250 GeV, both sides windowed two ways: the reference owns it. MadGraph's own dummy_cuts partition sums to 1.001221e-1 +- 2.2e-5 pb against its own unwindowed 9.998860e-2 +- 3.8e-5 pb over five fresh seeds at nevents=100000, +0.133%, 3.07 sigma on its own quoted errors -- the second occurrence of ee_to_mumu_tata_qcd0's shape, at 17x smaller size and by a different mechanism (get_channel_cut is identically 1 here: sde_strategy=1 with tmin_for_channel=-1 in both MadGraph lines, so the 3.5.7 defect is unreachable). This side's five independent per-window re-surveys close at -0.168% +- 0.110%, -1.53 sigma, and its total is seed-consistent (chi2/dof 0.69 over five seeds) and budget-stable (+0.177% under 4x against a 0.232% bound). The version story is refuted rather than confirmed: MadGraph 3.5.7 and 3.7.1 give 1.000624e-1 and 9.998860e-2 over five seeds each, +0.074% apart and 1.20 combined-seed-spread sigma, and 3.7.1's quoted error covers its own spread at both budgets (cloud chi2/dof 0.90 at 100k, 0.32 at the bank's 10k). rel_tol 0.03 is unchanged and was not widened. Unsettled and tracked separately: a localised +1.22% (6.1 sigma) and +0.87% (5.4 sigma) excess of this side over MadGraph in [39.4, 77) and [77, 144), chi2_flat 27.75 on 4 dof. Re-surveyed MadGraph confirms its own windowed value there rather than moving to ours -- imposing [39.4, 77) as run-card pta/ptamax, so the generator adapts to the window instead of having it applied after the fact, gives 2.759167e-2 pb over three seeds, 1.71 sigma from the dummy_cuts value on seed-spread errors and 4.67 sigma from this side's, closing only 22% of the gap. Window-blind sampling at the radiative-return turn-on is therefore excluded as the explanation, and the ~0.9-1.2% excess is a stable integrand-level disagreement with this side high: unattributed, tracked, and not a demotion. The secondary axis then localised it away from the resonance and away from this side. Re-partitioning the same phase space in m(mumu) with edges 0, 60, 86, 96, 200, 500 GeV, again through dummy_cuts, the two integrands agree in every window at worst 1.19 sigma, and the Z peak [86, 96) -- 43.8% of sigma, where a resonance-mapping or width disagreement would have to appear -- agrees to +0.126% +- 0.106%. The sums are the decisive fact: MadGraph's m(mumu) re-partition gives 1.006551e-1 pb, recovering this side's total to +0.016% (0.16 sigma) while exceeding its own unwindowed control by +0.667% (15.05 sigma) and its own pt(a) re-partition by +0.532% (16.70 sigma). Two complete dummy_cuts partitions of one MadGraph run's phase space therefore disagree with each other at 16.70 sigma, both above the control -- D1's signature at five times the size the pt(a) axis measured. The residual is thus localised to MadGraph's coverage in the pt(a)/eta(a) plane rather than to either matrix element (gated to 1e-11) or to the Z propagator: windowing in pt(a), by dummy_cuts or by run-card cuts alike, leaves MadGraph low, and windowing the same phase space in m(mumu) does not. Next probe named in the note: the 2D cell [39.4, 77) x [86, 96)" }
samples = { tier = "banked", mode = "info", note = "informational because the pt(a) KS cell flapped, which the watch item on this row's standing finding pre-registered together with this remedy: record the measurement, mark the row informational, file the disagreement, and do not move the 1e-4 p-floor. The flap: generation seed 0x5a4d0003 reads KS p 8.308e-6 at D 0.0306 on pt(a). It is reported on pt(a) and pt(ll) alike because those are one observable here -- at fixed e+e- beams a three-body final state balances the photon against the lepton pair, so the two columns carry the same number. The shape agreement did not move with it: mean D over the three generation seeds is 0.0241 -> 0.0242 and two of the three seeds improved (3.605e-4 -> 5.658e-3 and 1.954e-3 -> 6.639e-3), the gate reading being a minimum over seeds on the column that sits closest to the floor. The arm before the change reproduces P_FLOOR's own recorded 3.605e-4 exactly, so the reading this moved from is the recorded one. (ee_to_wpwm's pt(w+) cell at 1.573e-4 is the closest of any gating row, unrelated to this row's diagnosis.) The diagnosis context is the D record, and it is why this is filed rather than chased here -- the windowed measurement says the banked sample is the object that is wrong. All MadGraph events carry one identical XWGTUP, so the sample's pt(a) fractions estimate the same cross-section shares its windowed runs measure -- and they disagree, internally to MadGraph: over five fresh 100k-event runs the unwindowed sample puts 8.732% +- 0.033% of sigma in pt(a) in [10, 20) where MadGraph's own dummy_cuts cross section for that window puts 9.395%, a 0.66 pp / 19.9 sigma gap that reproduces on both MadGraph lines (3.5.7 samples give 8.805% and 8.655%). This side's two independent estimators land on the windowed number, not the sample: 9.378% from the per-window re-survey and 9.402% from the gate-configuration draws, while the two sides' integrals of that window agree to +0.20% +- 0.24%. The sample moves about 0.9 pp out of the two lowest pt(a) windows into the three radiative-return ones. P_FLOOR's own comment records the same conclusion for this column: it measures the reference's sample rather than this side's. Tracked as the standing ee_to_mumua finding in TODO.md -- the residual ~1% ours-high excess in the radiative-return pt(gamma) windows, left unattributed by chain D's D1 verdict and localised to MadGraph's pt(gamma)/eta(gamma) coverage rather than to either matrix element or the Z propagator -- whose named next probe is the 2D [39.4, 77) x [86, 96) (pt(gamma), m(mumu)) cell. The p-floor is unchanged" }

[[process]]
key = "ee_to_tatah"
process = "e+ e- > ta+ ta- h"
script = "validation/madgraph/scripts/ee_to_tatah.mg5"

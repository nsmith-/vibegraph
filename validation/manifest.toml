script = "validation/madgraph/scripts/ee_to_mumua.mg5"
class = "single-channel"
n_final = 3
rationale = "First external vector wavefunction (vxxxxx) compared against MadGraph; a massless photon has exactly two physical helicity states, so the state list itself is under test."
artifacts = ["output/ee_to_mumua", "output/ee_to_mumua.json", "output/ee_to_mumua_amplitude.csv", "sigma_reference.json#ee_to_mumua", "amplitudes/ee_to_mumua.json"]
mg_amplitude = { process = "e+ e- > mu+ mu- a", pdgs_in = [-11, 11], pdgs_out = [-13, 13, 22], sqrt_s_list = [200.0, 500.0], npoints = 25, seed = 17 }
[process.categories]
diagrams = { tier = "hermetic", mode = "gate" }
amplitudes = { tier = "hermetic", mode = "gate" }
integrals = { tier = "banked", mode = "gate", note = "run-card photon pT/isolation cuts regulate the soft and collinear divergences. Carries a standing +1.04% offset against the bank -- a fixed systematic, not a spread: five seeds at the gate budget give chi2/dof 0.50, and the cut-implied timelike floors move it by only +0.006%. The pull (+4.11 at five seeds) is therefore reported and not asserted (ee_to_mumua is in validate_sigma.rs's PULL_REPORTED_NOT_ASSERTED): a pull grows without bound against a systematic as this side's error falls. rel_tol 0.03 stays enforced and is what bounds the offset's size. The offset was adjudicated by windowing both sides in pt(a) and again in m(mumu): MadGraph's two dummy_cuts partitions of its own run disagree with each other at 16.70 sigma, its m(mumu) partition recovers this side's total to +0.016%, the Z peak (43.8% of sigma) agrees to +0.13%, and imposing the pt(a) window as a run-card cut closes only 22% of the gap -- so the residual ~1% ours-high excess in the radiative-return pt(a) windows is localised to MadGraph's coverage of the pt(a)/eta(a) plane, not to either matrix element (gated to 1e-11) or the Z propagator. The full adjudication is note 29's chain D (research/notes/29-v01-validation-sprint-plan.md); the named next probe is the 2D [39.4, 77) x [86, 96) (pt(a), m(mumu)) cell" }
samples = { tier = "banked", mode = "info", note = "informational because the pt(a) KS reading flapped across generation seeds -- worst p 8.3e-6 against the 1e-4 floor, on a shape agreement that did not move (mean D over seeds 0.0241 -> 0.0242, two of three seeds improved) -- and the watch item on this row's standing finding pre-registered exactly this remedy: record the measurement, mark the row informational, file the disagreement, do not move the floor. pt(a) and pt(ll) are one observable here (at fixed beams the photon balances the lepton pair), so both columns carry the same number. The diagnosis says the banked sample is the object in error, internally to MadGraph: over five fresh 100k-event runs its unweighted sample puts 8.732% +- 0.033% of sigma in pt(a) [10, 20) where its own windowed cross sections put 9.395% -- 19.9 sigma, reproduced on both MadGraph lines -- and this side's two independent estimators (the per-window re-survey and the gate-configuration draws) both land on the windowed number. Tracked as the standing ee_to_mumua finding in TODO.md, with the flap itself recorded in note 34; the p-floor is unchanged" }


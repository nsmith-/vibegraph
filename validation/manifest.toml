# ───────────────────────────── the toy-model rows ────────────────────────────
#
# Rows generated against the two UFO models this repository authors rather than
# vendors: `validation/ufo/vibegraph_toy_UFO` and `vibegraph_toy_color_UFO`.
# They exist because no model in reach writes the structures they carry.
# FeynRules expands `sigma^{mu nu}` into gamma-matrix chains before it emits a
# UFO, so a literal `Sigma` is in ALOHA's object library and in no model file;
# no Standard-Model vertex uses the symmetric structure constant `d`; and the
# baryonic `Epsilon` and the sextet `K6` are in no model this repository has.
# Each row puts one such structure in one vertex with a coupling chosen here, so
# a disagreement names the structure instead of a corner of a 900-vertex model.
#
# Because the models are ours, their restrict cards live inside the model
# directory rather than under `validation/madgraph/cards/`, and every one of
# them is a card this repository wrote.
#
# Every process string carries explicit order bounds. The models give each
# structure family a coupling order of its own -- which is what makes MadGraph
# split a two-structure vertex into two interactions, and so into two diagrams
# with an `AMP()` each rather than one diagram whose amplitude is already their
# sum -- and MadGraph's WEIGHTED search would drop the higher-order half of
# every interference the rows are built around.

[[process]]
key = "ll_to_qqx_toy_dipole"
process = "lt~ lt > qt qt~ NP<=1"
model = "validation/ufo/vibegraph_toy_UFO"
restrict = "dipole"
script = "validation/madgraph/scripts/ll_to_qqx_toy_dipole.mg5"
class = "single-channel"
n_final = 2
bundled = false
rationale = "A dipole whose Lorentz structure writes `Sigma` literally: `Sigma(3,-1,2,-2)*P(-1,3)*ProjM(-2,1)`, a momentum-contracted sigma^{mu nu} behind a chiral projector. No FeynRules-written model emits one, so this row and ll_to_qqx_toy_tensor are the only place the operator exists unexpanded. The dipole and the plain gauge coupling share the qt~ qt vt vertex at different coupling orders, so the row is two diagrams through one propagator and the dipole's phase and normalisation are measurable in the per-helicity interference rather than only in the helicity sum."
artifacts = ["output/ll_to_qqx_toy_dipole", "output/ll_to_qqx_toy_dipole.json", "output/ll_to_qqx_toy_dipole_amplitude.csv", "amplitudes/ll_to_qqx_toy_dipole.json"]
mg_amplitude = { process = "lt~ lt > qt qt~ NP<=1", pdgs_in = [-9000011, 9000011], pdgs_out = [9000004, -9000004], sqrt_s_list = [400.0, 500.0], npoints = 12, seed = 211 }
[process.categories]
diagrams = { tier = "hermetic", mode = "gate", note = "2 diagrams enumerated against MadGraph's 2 -- the s-channel vector with the gauge coupling at one end and the same propagator with the literal-`Sigma` dipole at the other, which MadGraph's splitting of the qt~ qt vt vertex into one interaction per coupling-order tuple keeps apart. Enforced now that the row's amplitude cell is: the count is what says the dipole interaction reaches diagram enumeration at all" }
amplitudes = { tier = "hermetic", mode = "gate", note = "the literal-`Sigma` dipole against MadGraph at every level: |M|^2 max_rel 5.56e-14 (grid) / 1.89e-15 (event), per-diagram 9.48e-15, per-flow 9.48e-15, JAMP2 3.89e-14, one fitted constant G = +1i with |G|-1 = 2.1e-15, and the configuration amplitude 1.75e-14 at |k|-1 = 7.1e-15. This is the row that pins `Sigma`'s global sign, and it does so through the per-diagram comparison rather than through |M|^2: the dipole amplitude is relatively *imaginary* to the gauge one (sigma^{mu nu} carries the i the plain gamma does not), so the interference term vanishes identically and negating the `SigmaVout` kernel leaves |M|^2 and JAMP2 unmoved at 5.56e-14 while per-diagram jumps to 3.0e-1 and the fitted G to -1i at |G|-1 = 4.3e-2. Giving the kernel the textbook normalisation instead of ALOHA's half moves |M|^2 to 2.97e0 (the dipole enters linearly, so the factor is 2). MadGraph merges the two diagrams into a single AMP2 accumulator -- one s-channel `vt` is one topology to its channel mapping, exactly as in `ee_to_ttx_dipole` -- so the row carries a KNOWN_CONFIG_MERGE entry and its configuration grouping is not compared" }
integrals = { tier = "uncovered", note = "the toy models bank no cross section. Their couplings and masses are chosen to make a structure visible per diagram, not to describe anything, so a sigma computed from them would measure the phase-space and flux machinery the Standard-Model rows already gate and nothing else. What these rows own is the amplitude level" }
samples = { tier = "uncovered", note = "no toy-model event sample is banked. What a samples cell measures -- unweighting, colour and helicity selection, the LHE writer -- is model-independent and gated on the Standard-Model rows" }


[package]
name = "vibegraph"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
build = "build.rs"

[[bin]]
name = "vibegraph"
path = "src/main.rs"

[features]
# Slow integration tests needing the fetched PDF set and banked MG references.
extended-validation = ["vibegraph-lib/extended-validation"]

[lints]
workspace = true

[dependencies]
vibegraph-lib = { path = "../vibegraph-lib" }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
ureq = "3.3.0"
rayon = "1"
tracing = "0.1"
# `env-filter` is what makes `RUST_LOG` and per-module scoping work; the rest of
# the sink machinery (`fmt`, `registry`) is on by default.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The samples gate reads one flag out of validation/manifest.toml — which rows the
# pinned reference bundle carries — through the same reader the library gates use.
toml = "1"
tar = "0.4.46"
flate2 = "1.1.9"
ureq = "3.3.0"

# `required-features` is how a test declares its dependency layer: everything
# listed here needs a fetched PDF set or a frozen MadGraph run, so it is absent
# from a default-feature build rather than deciding at runtime whether it has
# anything to do. See validation/manifest.toml.

[[test]]
name = "cli_integrate"
required-features = ["extended-validation"]

[[test]]
name = "cli_generate_proton"
required-features = ["extended-validation"]

[[test]]
name = "validate_samples_proton"
required-features = ["extended-validation"]

[[test]]
name = "cli_pdf_cache_fetched"
required-features = ["extended-validation"]

[package]
name = "vibegraph"
version.workspace = true
edition.workspace = true

[[bin]]
name = "vibegraph"
path = "src/main.rs"

[features]
# Slow integration tests needing the fetched PDF set and banked MG references.
extended-validation = ["vibegraph-lib/extended-validation"]

[dependencies]
vibegraph-lib = { path = "../vibegraph-lib" }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"

[dev-dependencies]
tempfile = "3"
serde_json = "1.0"

[[test]]
name = "cli_integrate"
required-features = ["extended-validation"]

[[test]]
name = "cli_generate_proton"
required-features = ["extended-validation"]
